<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#A487D6">
<meta name="description" content="Натяжка (TapTension) — проверка натяжения шнура подвеса холста по звуку удара: частота, затухание и чистота тона в сравнении с эталоном. Способ по патенту РФ № 2867038.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Натяжка">
<title>Натяжка — тюнер подвеса картин</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
  :root{
    --bg:#F4F2FA;
    --surface:#FFFFFF;
    --surface-2:#F1EDF9;
    --border:#E2DBF1;
    --ink:#332C46;
    --ink-muted:#8A81A0;
    --accent:#A487D6;
    --accent-fg:#FFFFFF;
    --accent-soft:#EDE4FA;
    --loose:#6E96C9;   --loose-bg:#E2ECF9;
    --tuned:#5CAE84;   --tuned-bg:#E1F3E8;
    --tight:#D97EA3;   --tight-bg:#FAE3ED;
    --radius:14px;
    --radius-sm:10px;
    --safe-t: env(safe-area-inset-top, 0px);
    --safe-b: env(safe-area-inset-bottom, 0px);
  }
  :root[data-theme="dark"]{
    --bg:#211C2E; --surface:#2A2438; --surface-2:#312A42; --border:#443A59;
    --ink:#EDE9F5; --ink-muted:#A79BC2;
    --accent:#BFA3E8; --accent-fg:#221A33; --accent-soft:#3B3050;
    --loose:#8FB4E0; --loose-bg:#293852;
    --tuned:#8AD1A9; --tuned-bg:#1F3A2C;
    --tight:#E8A2C0; --tight-bg:#452A38;
  }
  html{ height:100%; scroll-padding-top:var(--safe-t); }
  *{ box-sizing:border-box; }
  body{
    margin:0; height:100%; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;
    padding-top:var(--safe-t); padding-bottom:var(--safe-b);
    overflow-x:hidden;
  }
  button,input,select,textarea{ font-family:inherit; font-size:inherit; color:inherit; }

  .shell{ display:flex; min-height:100vh; }
  .rail{
    width:216px; flex-shrink:0; background:var(--surface); border-right:1px solid var(--border);
    display:flex; flex-direction:column; padding:22px 14px; position:sticky; top:0; height:100vh;
  }
  .brand-mark{ font-size:19px; font-weight:800; letter-spacing:0.08em; color:var(--accent); }
  .brand-sub{ font-size:11px; color:var(--ink-muted); margin:2px 0 20px; }
  .nav{ display:flex; flex-direction:column; gap:2px; }
  .nav-btn{
    display:flex; align-items:center; gap:10px; background:none; border:none; text-align:left;
    cursor:pointer; padding:10px 12px; border-radius:var(--radius-sm); color:var(--ink-muted); font-size:13.5px; font-weight:600;
  }
  .nav-btn:hover{ background:var(--surface-2); color:var(--ink); }
  .nav-btn.active{ background:var(--accent-soft); color:var(--accent); }
  .nav-ico{ width:18px; text-align:center; }
  .rail-foot{ margin-top:auto; padding-top:14px; border-top:1px solid var(--border); display:flex; flex-direction:column; gap:10px; }
  .theme-toggle{ display:flex; gap:4px; background:var(--surface-2); border-radius:var(--radius-sm); padding:3px; }
  .theme-btn{ flex:1; border:none; background:none; padding:6px 4px; border-radius:8px; color:var(--ink-muted); cursor:pointer; font-size:11.5px; }
  .theme-btn.active{ background:var(--surface); color:var(--ink); box-shadow:0 0 0 1px var(--border); }
  .install-btn{
    display:flex; align-items:center; justify-content:center; gap:6px; background:var(--accent-soft); color:var(--accent);
    border:none; border-radius:var(--radius-sm); padding:9px 10px; font-weight:700; font-size:12px; cursor:pointer;
  }
  .settings-btn{
    background:var(--surface-2); border:1px solid var(--border); color:var(--ink);
    border-radius:var(--radius-sm); padding:7px 10px; font-size:15px; cursor:pointer; line-height:1;
  }

  .main{ flex:1; min-width:0; padding:26px 26px 100px; max-width:640px; }
  .mobile-topbar{ display:none; }
  .topline{ margin-bottom:18px; }
  .view-title{ font-size:20px; font-weight:800; letter-spacing:-0.01em; }
  .view-sub{ color:var(--ink-muted); font-size:12.5px; margin-top:2px; }

  .frame{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:18px; }

  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
    background:var(--accent); color:var(--accent-fg); border:none; padding:11px 18px;
    border-radius:var(--radius-sm); font-weight:700; font-size:13.5px; cursor:pointer; white-space:nowrap;
  }
  .btn:hover{ opacity:0.92; }
  .btn.secondary{ background:var(--surface-2); color:var(--ink); }
  .btn.danger{ background:var(--tight); color:#fff; }
  .btn.block{ width:100%; }
  .btn.lg{ padding:15px 20px; font-size:14.5px; }
  .btn.sm{ padding:7px 12px; font-size:12.5px; }

  .empty{ text-align:center; padding:30px 14px; color:var(--ink-muted); }
  .empty-ico{ font-size:24px; margin-bottom:8px; opacity:0.75; }
  .empty-title{ color:var(--ink); font-weight:700; font-size:13.5px; margin-bottom:4px; }
  .empty-text{ font-size:12.5px; margin-bottom:14px; }

  /* -------- tuner screen -------- */
  .size-pick{ margin-bottom:16px; }
  .size-pick select{
    width:100%; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-sm);
    padding:10px 12px; font-weight:700; font-size:14px;
  }
  .tuner-face{ text-align:center; padding:26px 18px 22px; }
  .freq-readout{ font-size:52px; font-weight:800; letter-spacing:-0.02em; font-variant-numeric:tabular-nums; line-height:1; color:var(--accent); }
  .freq-unit{ font-size:16px; font-weight:700; color:var(--ink-muted); margin-left:4px; }
  .freq-target{ font-size:12.5px; color:var(--ink-muted); margin-top:6px; display:flex; align-items:center; justify-content:center; gap:8px; flex-wrap:wrap; }
  .link-btn{ background:none; border:none; color:var(--accent); font-weight:700; font-size:12px; cursor:pointer; padding:2px 4px; }

  .gauge{ margin:22px auto 6px; max-width:340px; }
  .gauge-track{ position:relative; height:10px; background:var(--surface-2); border-radius:10px; overflow:visible; }
  .gauge-zone{ position:absolute; top:0; bottom:0; background:var(--tuned-bg); border-radius:10px; }
  .gauge-mid{ position:absolute; top:-3px; bottom:-3px; width:2px; background:var(--ink-muted); left:50%; }
  .gauge-ptr{
    position:absolute; top:-7px; width:24px; height:24px; margin-left:-12px;
    border-radius:50%; background:var(--accent); box-shadow:0 0 0 3px var(--surface);
    transition:left 0.12s ease;
  }
  .gauge-labels{ display:flex; justify-content:space-between; font-size:11px; color:var(--ink-muted); margin-top:8px; }

  .verdict{
    margin-top:20px; padding:13px 16px; border-radius:var(--radius-sm); font-weight:700; font-size:14px;
    display:flex; align-items:center; justify-content:center; gap:8px;
  }
  .verdict.loose{ background:var(--loose-bg); color:var(--loose); }
  .verdict.tuned{ background:var(--tuned-bg); color:var(--tuned); }
  .verdict.tight{ background:var(--tight-bg); color:var(--tight); }
  .verdict.idle{ background:var(--surface-2); color:var(--ink-muted); font-weight:600; }

  .level-wrap{ display:flex; align-items:center; gap:10px; margin:18px 0 4px; }
  .osc-wrap{ margin:18px 0 4px; }
  .osc-label{ font-size:11px; color:var(--ink-muted); margin-bottom:6px; text-align:center; }
  .osc-canvas{ width:100%; height:52px; display:block; border-radius:var(--radius-sm); background:#000; }
  .level-bar{ flex:1; height:6px; background:var(--surface-2); border-radius:6px; overflow:hidden; }
  .level-fill{ height:100%; background:var(--accent); width:0%; transition:width 0.08s linear; }
  .level-label{ font-size:11px; color:var(--ink-muted); width:80px; text-align:right; }

  .sens-row{ display:flex; gap:6px; justify-content:center; margin-top:14px; }
  .sens-chip{
    padding:6px 12px; border-radius:20px; font-size:12px; font-weight:600; cursor:pointer;
    background:var(--surface-2); color:var(--ink-muted);
  }
  .sens-chip.active{ background:var(--accent); color:var(--accent-fg); }

  .mic-controls{ margin-top:20px; }
  .mic-note{ font-size:11.5px; color:var(--ink-muted); margin-top:10px; text-align:center; }
  .mic-error{ background:var(--tight-bg); color:var(--tight); padding:11px 14px; border-radius:var(--radius-sm); font-size:12.5px; margin-top:12px; }

  .history{ margin-top:20px; }
  .history-title{ font-size:11.5px; font-weight:700; text-transform:uppercase; letter-spacing:0.04em; color:var(--ink-muted); margin-bottom:8px; }
  .hist-row{ display:flex; justify-content:space-between; align-items:center; padding:7px 0; border-bottom:1px solid var(--border); font-size:12.5px; }
  .hist-row:last-child{ border-bottom:none; }

  /* -------- recorder panel -------- */
  .rec-card{ margin-top:14px; }
  .rec-card h4{ margin:0 0 6px; font-size:13.5px; }
  .rec-card p{ margin:0 0 12px; font-size:12.5px; color:var(--ink-muted); }
  .rec-progress{ height:8px; background:var(--surface-2); border-radius:8px; overflow:hidden; margin:14px 0 4px; }
  .rec-progress-fill{ height:100%; background:var(--tight); width:0%; transition:width 0.08s linear; }
  .rec-dot{ display:inline-block; width:9px; height:9px; border-radius:50%; background:var(--tight); margin-right:7px; animation:pulse 1s infinite; }
  @keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:0.35;} }
  .rec-result{ display:flex; align-items:center; gap:10px; margin:10px 0 14px; }
  .rec-audio{ flex:1; width:100%; height:36px; }
  .manual-row{ display:flex; gap:8px; margin-top:16px; align-items:center; }
  .manual-row input{
    flex:1; background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius-sm);
    padding:9px 11px;
  }

  /* -------- slots grid -------- */
  .section-title{ font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:0.04em; color:var(--ink-muted); margin:22px 0 10px; }
  .section-title:first-child{ margin-top:0; }
  .slot-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(148px,1fr)); gap:10px; }
  .slot{
    border-radius:var(--radius); padding:14px; cursor:pointer; text-align:left; position:relative;
    border:1.5px dashed var(--border); background:var(--surface-2);
  }
  .slot.added{ border-style:solid; background:var(--surface); }
  .slot.tuned{ border-color:var(--tuned); }
  .slot-name{ font-weight:700; font-size:13.5px; }
  .slot-status{ font-size:11.5px; color:var(--ink-muted); margin-top:5px; }
  .slot.tuned .slot-status{ color:var(--tuned); font-weight:700; }
  .slot-plus{ font-size:15px; color:var(--accent); font-weight:800; }
  .slot-del{ position:absolute; top:6px; right:6px; background:none; border:none; color:var(--ink-muted); cursor:pointer; font-size:13px; padding:3px 5px; line-height:1; }
  .slot-del:hover{ color:var(--tight); }

  .toolbar{ display:flex; justify-content:flex-end; margin-bottom:14px; }
  .size-list{ display:flex; flex-direction:column; gap:10px; }
  .size-row{ display:flex; align-items:center; justify-content:space-between; padding:14px 16px; cursor:pointer; }
  .size-row-name{ font-weight:700; font-size:14px; }
  .size-row-meta{ font-size:12px; color:var(--ink-muted); margin-top:3px; }
  .chev{ color:var(--ink-muted); font-size:15px; }

  /* -------- drawer -------- */
  .overlay{ position:fixed; inset:0; background:rgba(45,32,70,0.32); z-index:40; opacity:0; pointer-events:none; transition:opacity 0.16s ease; }
  .overlay.open{ opacity:1; pointer-events:auto; }
  .drawer{
    position:fixed; top:0; right:0; height:100%; width:min(420px,100%); background:var(--surface); z-index:41;
    box-shadow:-8px 0 24px rgba(60,40,90,0.14); transform:translateX(100%); transition:transform 0.2s ease;
    display:flex; flex-direction:column;
  }
  .drawer.open{ transform:translateX(0); }
  .drawer-head{ display:flex; align-items:center; justify-content:space-between; padding:18px 20px; border-bottom:1px solid var(--border); }
  .drawer-title{ font-size:15px; font-weight:700; }
  .drawer-close{ background:none; border:none; font-size:18px; color:var(--ink-muted); cursor:pointer; padding:4px; }
  .drawer-body{ padding:18px 20px; overflow-y:auto; flex:1; }
  .drawer-foot{ padding:14px 20px; border-top:1px solid var(--border); display:flex; gap:8px; }

  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:12px; font-weight:700; color:var(--ink-muted); margin-bottom:5px; }
  .field input, .field select{
    width:100%; background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius-sm); padding:9px 11px;
  }
  .field input:focus, .field select:focus{ outline:none; border-color:var(--accent); }
  .field-row{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .field-hint{ font-size:11.5px; color:var(--ink-muted); margin-top:4px; }

  /* -------- install tip toast -------- */
  .toast{
    position:fixed; left:16px; right:16px; bottom:calc(16px + var(--safe-b)); z-index:50;
    background:var(--ink); color:var(--bg); padding:14px 16px; border-radius:var(--radius);
    font-size:12.5px; max-width:420px; margin:0 auto; box-shadow:0 10px 30px rgba(0,0,0,0.2);
    transform:translateY(140%); transition:transform 0.22s ease;
  }
  .toast.open{ transform:translateY(0); }
  .toast b{ display:block; margin-bottom:4px; font-size:13px; }
  .toast-close{ position:absolute; top:8px; right:10px; background:none; border:none; color:var(--bg); opacity:0.7; font-size:14px; cursor:pointer; }

  @media (max-width:820px){
    .rail{
      position:fixed; bottom:0; left:0; right:0; top:auto; width:100%; height:auto; flex-direction:row;
      align-items:center; justify-content:space-around; padding:8px 6px calc(8px + var(--safe-b));
      border-right:none; border-top:1px solid var(--border); z-index:30;
    }
    .brand-mark,.brand-sub,.rail-foot{ display:none; }
    .nav{ flex-direction:row; width:100%; justify-content:space-around; }
    .nav-btn{ flex-direction:column; gap:3px; font-size:10.5px; padding:6px 4px; }
    .nav-ico{ font-size:17px; }
    .main{ padding:16px 14px 96px; max-width:none; }
    .mobile-topbar{ display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
    .mobile-topbar .brand-mark{ font-size:17px; }
    .mobile-topbar .install-btn{ padding:7px 10px; font-size:11.5px; }
    .freq-readout{ font-size:44px; }
  }

  /* ===== 2.3 ===== */
  :root{ --reject:#C4513F; --reject-bg:#F8E1DC; }
  :root[data-theme="dark"]{ --reject:#F29A8A; --reject-bg:#4A2A2E; }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme]){
      --bg:#211C2E; --surface:#2A2438; --surface-2:#312A42; --border:#443A59;
      --ink:#EDE9F5; --ink-muted:#A79BC2;
      --accent:#BFA3E8; --accent-fg:#221A33; --accent-soft:#3B3050;
      --loose:#8FB4E0; --loose-bg:#293852;
      --tuned:#8AD1A9; --tuned-bg:#1F3A2C;
      --tight:#E8A2C0; --tight-bg:#452A38;
      --reject:#F29A8A; --reject-bg:#4A2A2E;
    }
  }
  .verdict.reject{ background:var(--reject-bg); color:var(--reject); }
  .lang-btn{ flex:1; border:none; background:none; padding:6px 4px; border-radius:8px; color:var(--ink-muted); cursor:pointer; font-size:11.5px; }
  .lang-btn.active{ background:var(--surface); color:var(--ink); box-shadow:0 0 0 1px var(--border); }
  .standalone .install-btn{ display:none !important; }
  .metrics{ display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:12px 0 2px; }
  .metric{ background:var(--surface-2); border-radius:var(--radius-sm); padding:8px 10px; text-align:center; }
  .m-label{ font-size:10.5px; color:var(--ink-muted); }
  .m-val{ font-size:18px; font-weight:800; line-height:1.35; }
  .m-val.txt{ font-size:12px; font-weight:700; line-height:1.3; padding:4px 0 3px; }
  .m-val.bad{ color:var(--reject); }
  .m-ref{ font-size:10.5px; color:var(--ink-muted); }
  .ref-hint{ font-size:11.5px; color:var(--ink-muted); background:var(--surface-2); border-radius:var(--radius-sm); padding:8px 10px; margin-top:10px; text-align:center; }
  .hist-row{ gap:6px; }
  .hist-row .h-time{ min-width:74px; color:var(--ink-muted); }
  .hist-row .h-dec{ min-width:44px; text-align:right; }
  .h-v{ width:16px; text-align:center; font-weight:800; }
  .h-v.tuned{ color:var(--tuned); } .h-v.loose{ color:var(--loose); } .h-v.tight{ color:var(--tight); } .h-v.reject{ color:var(--reject); }
  .h-del{ background:none; border:none; color:var(--ink-muted); cursor:pointer; font-size:13px; padding:2px 4px; }
  .journal-stats{ display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin-bottom:12px; text-align:center; }
  .journal-stats b{ display:block; font-size:19px; line-height:1.2; }
  .journal-stats span{ font-size:10.5px; color:var(--ink-muted); }
  .journal-stats .ok b{ color:var(--tuned); } .journal-stats .out b{ color:var(--tight); } .journal-stats .bad b{ color:var(--reject); }
  .toast.notice{ z-index:60; cursor:pointer; }
  .toast{ visibility:hidden; transition:transform 0.22s ease, visibility 0s linear 0.22s; }
  .toast.open{ visibility:visible; transition:transform 0.22s ease; }
  @media (max-width:820px){
    .toast{ bottom:calc(76px + var(--safe-b)); transform:translateY(calc(100% + 110px)); }
    .toast.open{ transform:translateY(0); }
  }
  .drawer{ visibility:hidden; transition:transform 0.2s ease, visibility 0s linear 0.2s; }
  .drawer.open{ visibility:visible; transition:transform 0.2s ease; }
  .tone-btn{ white-space:normal; min-width:200px !important; }
  @media (max-width:820px){
    .mobile-topbar .brand-mark{ display:block; }
  }
  .btn{ max-width:100%; }
  /* ===== 2.4: два режима, реестр, печатные формы ===== */
  .mode-switch{ display:flex; gap:3px; padding:3px; margin:0 0 6px; background:var(--surface-2); border:1px solid var(--border); border-radius:12px; }
  .mode-btn{ flex:1; border:none; background:none; padding:8px 10px; border-radius:9px; font-weight:700; font-size:13px; color:var(--ink-muted); cursor:pointer; }
  .mode-btn.active{ background:var(--surface); color:var(--accent); box-shadow:0 0 0 1px var(--border); }
  .mode-hint{ font-size:11.5px; color:var(--ink-muted); margin:0 0 14px; line-height:1.4; }
  .drawer .mode-switch{ margin-bottom:4px; }
  .pro-line{ display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap; font-size:12px; color:var(--ink-muted); margin:-4px 0 12px; }
  .pro-banner{ background:var(--tight-bg); color:var(--ink); border-radius:var(--radius-sm); padding:10px 12px; font-size:12.5px; line-height:1.45; margin-bottom:12px; }
  .pro-banner .btn{ display:flex; }
  .recheck-note{ background:var(--loose-bg); color:var(--loose); border-radius:var(--radius-sm); padding:8px 10px; font-size:12.5px; font-weight:700; margin:0 0 12px; }
  .sag-row{ margin:16px 0 12px; }
  .sag-label{ font-size:12px; font-weight:700; color:var(--ink-muted); margin-bottom:6px; }
  .seg{ display:flex; gap:6px; }
  .seg-btn{ flex:1; padding:11px 8px; border-radius:var(--radius-sm); border:1px solid var(--border); background:var(--surface-2); color:var(--ink); font-weight:700; font-size:13px; cursor:pointer; }
  .seg-btn.ok.active{ background:var(--tuned-bg); color:var(--tuned); border-color:var(--tuned); }
  .seg-btn.bad.active{ background:var(--reject-bg); color:var(--reject); border-color:var(--reject); }
  .btn[disabled]{ opacity:0.45; cursor:not-allowed; }
  .btn-row{ display:flex; flex-wrap:wrap; gap:8px; }
  .btn-row .btn{ flex:1 1 auto; }
  .stack{ display:flex; flex-direction:column; gap:8px; }
  .result-card{ position:relative; border-radius:var(--radius); padding:14px 40px 14px 16px; margin-bottom:14px; font-size:12.5px; line-height:1.5; }
  .result-card b{ display:block; font-size:14.5px; margin-bottom:4px; }
  .result-card.pass{ background:var(--tuned-bg); color:var(--tuned); }
  .result-card.fail{ background:var(--reject-bg); color:var(--reject); }
  .result-card.aborted{ background:var(--surface-2); color:var(--ink); }
  .rc-close{ position:absolute; top:8px; right:8px; background:none; border:none; color:inherit; font-size:15px; cursor:pointer; padding:4px 6px; }
  .pend-row, .reg-row{ display:flex; align-items:center; gap:8px; padding:8px 0; border-bottom:1px solid var(--border); font-size:12.5px; }
  .pend-row:last-child, .reg-row:last-child{ border-bottom:none; }
  .r-main{ flex:1; min-width:0; overflow-wrap:anywhere; }
  .r-sub{ display:block; font-size:11px; color:var(--ink-muted); margin-top:2px; }
  .r-no{ font-weight:800; min-width:40px; }
  .r-time{ color:var(--ink-muted); min-width:74px; }
  .r-res{ width:18px; text-align:center; font-weight:800; }
  .r-res.pass{ color:var(--tuned); } .r-res.fail{ color:var(--reject); } .r-res.aborted{ color:var(--ink-muted); }
  .journal-stats.five{ grid-template-columns:repeat(5,1fr); }
  .journal-stats.five span{ display:block; line-height:1.25; }
  .size-row.picked{ border-color:var(--accent); box-shadow:0 0 0 1px var(--accent); }
  input[type="date"]{ min-width:0; }
  #printView{ display:none; }
  html.printing body{ background:#fff; }
  html.printing .shell, html.printing .overlay, html.printing .drawer, html.printing .toast{ display:none !important; }
  html.printing #printView{ display:block; background:#fff; color:#111; min-height:100vh; }
  .pv-bar{ position:sticky; top:0; z-index:2; display:flex; gap:8px; padding:10px 14px; background:#F4F2FA; border-bottom:1px solid #DDD; }
  .pv-doc{ padding:18px 16px 40px; font:12px/1.45 -apple-system, "Segoe UI", Roboto, Arial, sans-serif; color:#111; max-width:1100px; }
  .pv-doc h1{ font-size:16px; margin:0 0 6px; }
  .pv-doc h2{ font-size:13.5px; margin:18px 0 6px; }
  .pv-meta{ color:#444; font-size:11px; margin-bottom:10px; }
  .pv-doc table{ width:100%; border-collapse:collapse; margin:4px 0 10px; font-size:10.5px; }
  .pv-doc th, .pv-doc td{ border:1px solid #999; padding:3px 5px; text-align:left; vertical-align:top; }
  .pv-doc th{ background:#EEE; }
  .pv-scroll{ overflow-x:auto; }
  .pv-sign{ margin-top:28px; }
  @media print{
    .pv-bar{ display:none !important; }
    .pv-doc{ padding:0; max-width:none; }

    .pv-doc tr{ page-break-inside:avoid; }
  }

на, по которому шла проверка.": "Delete {0} together with its reference? Registry records stay: each record holds the data of the reference it was checked against.","Очистить все удары подбора для этой длины?": "Clear all tuning strikes for this length?","Пороги применены. Они сохраняются в каждой новой записи реестра.": "Thresholds applied. They are saved in every new registry record.","версия {0}": "version {0}","тюнер натяжения подвеса картин": "canvas hanging-cord tension tuner","📲 Установить на телефон": "📲 Install on phone","ⓘ О разработчике": "ⓘ About","<b>Установка на Android</b>Chrome → меню (⋮) в правом верхнем углу → «Добавить на главный экран» или «Установить приложение».": "<b>Install on Android</b>Chrome → menu (⋮) in the top right corner → “Add to Home screen” or “Install app”."};

<script>

/* ===================== storage ===================== */
var STORE_KEY = "canvas_tension_v2";
var state = { sizes: [], selectedSizeId: null, sensitivity: "normal", avgTaps: 1, seq: 1,
  mode: "simple", proSelectedSizeId: null, thresholds: null, pro: {}, calib: {} };

function loadState(){
  try{
    var raw = localStorage.getItem(STORE_KEY);
    if(raw){
      var p = JSON.parse(raw);
      if(p && typeof p === "object"){
        state.sizes = Array.isArray(p.sizes) ? p.sizes : [];
        state.selectedSizeId = p.selectedSizeId || null;
        state.sensitivity = SENS[p.sensitivity] ? p.sensitivity : "normal";
        state.avgTaps = (p.avgTaps===3) ? 3 : 1;
        state.seq = typeof p.seq === "number" ? p.seq : 1;
        state.mode = p.mode === "pro" ? "pro" : "simple";
        state.proSelectedSizeId = p.proSelectedSizeId || null;
        state.thresholds = (p.thresholds && typeof p.thresholds === "object") ? p.thresholds : null;
        state.pro = (p.pro && typeof p.pro === "object") ? p.pro : {};
        state.calib = (p.calib && typeof p.calib === "object") ? p.calib : {};
      }
    }else{
      var oldRaw = localStorage.getItem("canvas_tension_v1");
      if(oldRaw){
        var op = JSON.parse(oldRaw);
        if(op && Array.isArray(op.sizes)){
          state.sizes = op.sizes; state.selectedSizeId = op.selectedSizeId||null;
          state.sensitivity = op.sensitivity||"normal"; state.seq = op.seq||1;
        }
      }
    }
  }catch(e){}
  fixSelection();
}
var storageWarned = false;
function saveState(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); storageWarned = false; }
  catch(e){
    if(!storageWarned){
      storageWarned = true;
      notify(T("Не удалось сохранить: память приложения заполнена. Сохраните резервную копию и очистите старые замеры журнала."));
    }
  }
}
function nextId(){ state.seq++; return "s"+state.seq+"_"+Date.now().toString(36); }
function sizeById(id){ return state.sizes.find(function(s){return s.id===id;}); }
/* два режима: «Лайт» — слоты размеров холста и журнал ударов; «Про» — эталоны по длине стороны со шнуром и реестр проверок */
function isPro(){ return state.mode === "pro"; }
function isSideSize(s){ return !!s && s.kind === "side"; }
function modeSizes(){ return state.sizes.filter(function(s){ return isPro() ? isSideSize(s) : !isSideSize(s); }); }
function selId(){ return isPro() ? state.proSelectedSizeId : state.selectedSizeId; }
function setSel(id){ if(isPro()) state.proSelectedSizeId = id; else state.selectedSizeId = id; }
function curSize(){ var s = sizeById(selId()); return (s && (isPro() ? isSideSize(s) : !isSideSize(s))) ? s : null; }
function fixSelection(){
  var simple = state.sizes.filter(function(s){ return !isSideSize(s); }), side = state.sizes.filter(isSideSize);
  var a = sizeById(state.selectedSizeId);
  if(!a || isSideSize(a)) state.selectedSizeId = simple.length ? simple[0].id : null;
  var b = sizeById(state.proSelectedSizeId);
  if(!b || !isSideSize(b)) state.proSelectedSizeId = side.length ? side[0].id : null;
}

/* ===================== files: backup, sample, journal ===================== */
function downloadBlob(blob, filename){
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
}
function todayStamp(){ var d = new Date(); return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate()); }

function exportData(){
  try{
    var payload = { app: "canvas-tension-tuner", version: APP_VERSION, exportedAt: new Date().toISOString(), state: state, registry: registry };
    downloadBlob(new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" }), FILE_PREFIX+"-backup-"+todayStamp()+".json");
    if(registry.length){ state.pro.lastExportTs = Date.now(); saveState(); render(); }
  }catch(e){
    notify(T("Не удалось создать файл резервной копии."));
  }
}
function importDataFromFile(file){
  var reader = new FileReader();
  reader.onload = function(){
    var parsed;
    try{ parsed = JSON.parse(reader.result); }
    catch(e){ notify(T("Файл повреждён или это не резервная копия приложения.")); return; }
    var incoming = (parsed && parsed.state) ? parsed.state : parsed;
    if(!incoming || !Array.isArray(incoming.sizes)){
      notify(T("Файл повреждён или это не резервная копия приложения."));
      return;
    }
    var incomingReg = (parsed && Array.isArray(parsed.registry)) ? parsed.registry : [];
    if(!confirm(F(T("Заменить размеры, эталоны и настройки (сейчас размеров: {0}) данными из файла (размеров: {1})? Записи реестра проверок не удаляются: записи из файла добавятся к ним."), state.sizes.length, incoming.sizes.length))) return;
    state.sizes = incoming.sizes;
    state.selectedSizeId = incoming.selectedSizeId || null;
    state.proSelectedSizeId = incoming.proSelectedSizeId || null;
    state.sensitivity = SENS[incoming.sensitivity] ? incoming.sensitivity : "normal";
    state.avgTaps = (incoming.avgTaps===3) ? 3 : 1;
    state.seq = typeof incoming.seq === "number" ? incoming.seq : (incoming.sizes.length+1);
    if(incoming.mode === "pro" || incoming.mode === "simple") state.mode = incoming.mode;
    if(incoming.thresholds && typeof incoming.thresholds === "object") state.thresholds = incoming.thresholds;
    if(incoming.pro && typeof incoming.pro === "object"){
      var keepNo = state.pro.nextNo || 1;
      state.pro = incoming.pro;
      state.pro.nextNo = Math.max(keepNo, incoming.pro.nextNo || 1);
    }
    if(incoming.calib && typeof incoming.calib === "object") state.calib = incoming.calib;
    fixSelection();
    saveState();
    regMerge(incomingReg, function(added){
      render();
      notify(incomingReg.length ? F(T("Данные загружены. Записей реестра добавлено: {0}."), added) : T("Данные загружены."));
    });
  };
  reader.onerror = function(){ notify(T("Не удалось прочитать файл.")); };
  reader.readAsText(file);
}

/*i18n-off*/
function safeName(n){ return String(n).replace(/[^\wа-яА-ЯёЁ]+/g, "-"); }
function csvCell(v, sep){ v = String(v == null ? "" : v); return (v.indexOf(sep) >= 0 || /["\r\n]/.test(v)) ? '"' + v.replace(/"/g, '""') + '"' : v; }
/*i18n-on*/

function exportSingleSample(size){
  try{
    var payload = { app: "canvas-tension-tuner-sample", version: APP_VERSION, exportedAt: new Date().toISOString(),
      sample: { name: size.name, target: size.target, tolerance: size.tolerance||3, refAudio: size.refAudio||null,
        refDecay: size.refDecay!=null ? size.refDecay : null, refDecayState: size.refDecayState||null,
        refPurity: size.refPurity!=null ? size.refPurity : null } };
    downloadBlob(new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" }),
      FILE_PREFIX+(LANG==="en" ? "-sample-" : "-obrazec-")+safeName(size.name)+".json");
  }catch(e){
    notify(T("Не удалось создать файл образца."));
  }
}
function importSingleSampleFile(file, targetSizeId, onDone){
  var reader = new FileReader();
  reader.onload = function(){
    var parsed;
    try{ parsed = JSON.parse(reader.result); }
    catch(e){ notify(T("Файл повреждён или это не файл образца.")); return; }
    var sample = (parsed && parsed.sample) ? parsed.sample : parsed;
    if(!sample || typeof sample.target !== "number"){
      notify(T("Файл повреждён или это не файл образца."));
      return;
    }
    var size = sizeById(targetSizeId);
    if(!size) return;
    if(!confirm(F(T("Загрузить образец «{0}» ({1} Гц) в слот «{2}»?"), sample.name ? sizeLabel(sample.name) : T("без имени"), fmtHz(sample.target), sizeLabel(size.name)))) return;
    size.target = sample.target;
    size.tolerance = (typeof sample.tolerance==="number") ? sample.tolerance : (size.tolerance||3);
    size.refAudio = sample.refAudio || null;
    size.refDecay = (typeof sample.refDecay==="number") ? sample.refDecay : null;
    size.refPurity = (typeof sample.refPurity==="number") ? sample.refPurity : null;
    size.refDecayState = sample.refDecayState || undefined;
    saveState();
    notify(T("Образец загружен."));
    if(onDone) onDone();
  };
  reader.onerror = function(){ notify(T("Не удалось прочитать файл.")); };
  reader.readAsText(file);
}

/* ===================== helpers ===================== */
/*i18n-off*/
function escapeHtml(str){

  var d = new Date(ts), time = pad2(d.getHours())+":"+pad2(d.getMinutes());
  return (LANG==="en" ? pad2(d.getMonth()+1)+"/"+pad2(d.getDate()) : pad2(d.getDate())+"."+pad2(d.getMonth()+1)) + " " + time;

/* ===================== screen wake lock ===================== */
var wakeLockRef = null;
function acquireWakeLock(){
  try{
    if(!("wakeLock" in navigator)) return;
    navigator.wakeLock.request("screen").then(function(lock){
      wakeLockRef = lock;
      lock.addEventListener("release", function(){ wakeLockRef = null; });
    }).catch(function(){});
  }catch(e){}
}
function releaseWakeLock(){
  if(wakeLockRef){ try{ wakeLockRef.release(); }catch(e){} wakeLockRef = null; }
}
document.addEventListener("visibilitychange", function(){
  if(document.visibilityState === "visible" && listening && !wakeLockRef){ acquireWakeLock(); }

var PRESET_SIZES = ["20×30 см","30×40 см","40×50 см","40×60 см","50×60 см","50×70 см","60×80 см","60×90 см","70×100 см","80×100 см","90×120 см","100×150 см"];

/* ===================== sound analysis ===================== */
/* DSP-BEGIN */
/* Анализ звука удара. Этот блок не зависит от интерфейса — его же проверяют автотесты. */
var MIN_CONF = 0.4;          // минимальная периодичность кадра, чтобы считать тон найденным
var CAPTURE_MS = 220;        // окно захвата удара для определения частоты и чистоты тона
var DECAY_DB = 20;           // время затухания — до спада уровня основного тона на 20 дБ от пика
var DECAY_MAX_MS = 2500;     // дольше не ждём: если тон звучит дольше, это не брак
var DECAY_REL_MIN = 0.6;     // брак «быстро затухает»: затухание короче 60% эталонного
var PURITY_ABS_MIN = 0.4;    // брак «дребезг»: чистота тона ниже 40%...
var PURITY_REL_MIN = 0.75;   // ...или ниже 75% от чистоты эталона
var PURITY_FREQ_TOL = 0.03;  // кадр идёт в зачёт чистоты, если его частота в пределах ±3% от основной

function computeRMS(buf){
  var sum=0;

/* Частота основного тона и чистота (нормированная автокорреляция, 0…1).

function nccAt(x, lag){

var _hann = {};

  for(var i=0;i<n;i++){ w[i] = 0.5-0.5*Math.cos(2*Math.PI*i/(n-1)); sum += w[i]; }

/* момент пересечения порога между двумя замерами уровня — линейно в децибелах */

/* Затухание по записи: время спада основного тона на DECAY_DB от пика.

  for(e=W; e <= trig - Math.round(0.03*sr); e += hop*4){ pre.push(toneLevel(data, e, W, f0, sr)); }
  var noise = pre.length >= 3 ? medianOf(pre) : null;

/* Полный разбор записанного удара (эталон): частота, чистота тона, затухание.

/* Вердикт по одному удару (или по среднему нескольких).

    purityAbs: minPur == null ? PURITY_ABS_MIN : Math.round(clamp(Math.min(PURITY_ABS_MIN, minPur*0.9), 0.2, PURITY_ABS_MIN)*100)/100

  out.goodN = good.length; out.badN = bad.length;

/* Живой режим: удар → частота и чистота тона за CAPTURE_MS → затухание.

function getSearchRange(size){
  if(!size) return null;
  if(size.rangeMin!=null && size.rangeMax!=null && size.rangeMax>size.rangeMin){
    return [size.rangeMin, size.rangeMax];
  }
  if(size.target){
    return [Math.max(30, size.target*0.55), Math.min(2500, size.target*1.6)];
  }
  return null;
}
function verdictInfo(v){
  switch(v){
    case "tuned":  return { cls:"tuned",  icon:"✓", text:T("Натяжение в норме"), short:T("норма") };
    case "loose":  return { cls:"loose",  icon:"▲", text:T("Подтяните сильнее — натяжение слабое"), short:T("слабо") };
    case "tight":  return { cls:"tight",  icon:"▼", text:T("Слишком туго — немного ослабьте"), short:T("туго") };
    case "fast":   return { cls:"reject", icon:"✕", text:T("Брак: звук быстро затухает"), short:T("брак: быстро затухает") };
    case "rattle": return { cls:"reject", icon:"✕", text:T("Брак: дребезг, нечистый тон"), short:T("брак: дребезг") };
    case "dull":   return { cls:"reject", icon:"✕", text:T("Брак: глухой звук"), short:T("брак: глухой звук") };
  }
  return null;
}
function decayText(ms, st){
  if(ms == null || !st || st === "none") return "—";
  if(st === "noisy") return T("шумно, не оценено");
  if(st === "interrupted") return T("прерван новым ударом");
  if(st === "long") return (ms >= DECAY_MAX_MS ? T("дольше") : T("не меньше")) + " " + fmtSec(ms) + " " + T("с");
  return fmtSec(ms) + " " + T("с");
}

function startListening(onTap){
  micErrorMsg = null;
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    micErrorMsg = T("Этот браузер не поддерживает доступ к микрофону. Откройте приложение в Chrome.");
    render(); return;
  }
  navigator.mediaDevices.getUserMedia({ audio:{ echoCancellation:false, noiseSuppression:false, autoGainControl:false } })
    .then(function(stream){
      micStream = stream;
      audioCtx = new (window.AudioContext||window.webkitAudioContext)();
      if(audioCtx.state === "suspended" && audioCtx.resume){ audioCtx.resume(); }
      var source = audioCtx.createMediaStreamSource(stream);
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 4096;
      source.connect(analyser);
      timeData = new Float32Array(analyser.fftSize);
      engine = new TapEngine(audioCtx.sampleRate);
      onTapCallback = onTap;
      listening = true;
      acquireWakeLock();
      resetOscilloscope();
      loop();
      render();
    })
    .catch(function(err){
      micErrorMsg = F(T("Микрофон не запустился: {0}. Разрешите приложению доступ к микрофону и попробуйте снова."), describeMicError(err));
      render();
    });
}
function stopListening(){
  listening=false;
  if(rafId) cancelAnimationFrame(rafId);
  rafId=null;
  if(micStream){ micStream.getTracks().forEach(function(t){t.stop();}); micStream=null; }
  if(audioCtx){ try{ audioCtx.close(); }catch(e){} audioCtx=null; }
  analyser=null; engine=null; onTapCallback=null;
  releaseWakeLock();
  resetOscilloscope();
  render();
}
function loop(){
  if(!listening) return;
  rafId = requestAnimationFrame(loop);
  analyser.getFloatTimeDomainData(timeData);
  var size = curSize();
  var ev = engine.process(timeData, performance.now(), SENS[state.sensitivity] || SENS.normal, getSearchRange(size), size ? size.target : null);
  if(ev && onTapCallback) onTapCallback(ev);
  updateOscilloscope(timeData.subarray(timeData.length-2048));
}
var OSC_COLS = 56;
var oscBuffer = new Array(OSC_COLS).fill(0);
function resetOscilloscope(){ oscBuffer = new Array(OSC_COLS).fill(0); drawOscilloscope(); }
function updateOscilloscope(buf){
  var peak = 0;
  for(var i=0;i<buf.length;i++){ var v=Math.abs(buf[i]); if(v>peak) peak=v; }
  oscBuffer.push(Math.min(1, peak*3));
  if(oscBuffer.length>OSC_COLS) oscBuffer.shift();
  drawOscilloscope();
}
function drawOscilloscope(){
  var canvas = document.getElementById("oscCanvas");
  if(!canvas || !canvas.getContext) return;
  var ctx = canvas.getContext("2d");
  var w = canvas.width, h = canvas.height, midY = h/2;

  ctx.fillStyle = "#000000";
  ctx.fillRect(0,0,w,h);

  var gridCols = 10, gridRows = 4;
  ctx.strokeStyle = "rgba(60,200,110,0.18)";
  ctx.lineWidth = 1;
  ctx.beginPath();
  for(var gx=1; gx<gridCols; gx++){
    var gxp = Math.round(w*gx/gridCols)+0.5;
    ctx.moveTo(gxp,0); ctx.lineTo(gxp,h);
  }
  for(var gy=1; gy<gridRows; gy++){
    var gyp = Math.round(h*gy/gridRows)+0.5;
    ctx.moveTo(0,gyp); ctx.lineTo(w,gyp);
  }
  ctx.stroke();
  ctx.strokeStyle = "rgba(60,200,110,0.32)";
  ctx.beginPath();
  ctx.moveTo(0, Math.round(midY)+0.5); ctx.lineTo(w, Math.round(midY)+0.5);
  ctx.stroke();

  var colW = w/(OSC_COLS-1);
  for(var i=0;i<oscBuffer.length-1;i++){
    var v1 = oscBuffer[i], v2 = oscBuffer[i+1];
    var x1 = i*colW, x2 = (i+1)*colW;
    var alpha = 0.15 + 0.85*(i/(OSC_COLS-2));
    ctx.strokeStyle = "rgba(57,255,120,"+alpha.toFixed(2)+")";
    ctx.lineWidth = 2;
    ctx.lineCap = "round";
    var amp = h/2-4;
    ctx.beginPath();
    ctx.moveTo(x1, midY - v1*amp); ctx.lineTo(x2, midY - v2*amp);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(x1, midY + v1*amp); ctx.lineTo(x2, midY + v2*amp);
    ctx.stroke();
  }
}

/* ===================== recorder engine (sample capture + playback) ===================== */
var REC_MAX_MS = 3000;
var recStream=null, recMediaRecorder=null, recChunks=[], recTimer=null, recStart=0, recRafId=null;
var recState = "idle";      // idle | recording | processing | done
var recDataUrl = null, recFreq = null, recResult = null, recSamples = null, recErrorMsg = null;

function pickMimeType(){
  var types = ["audio/webm;codecs=opus","audio/webm","audio/mp4","audio/ogg;codecs=opus"];
  for(var i=0;i<types.length;i++){
    if(window.MediaRecorder && MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(types[i])) return types[i];
  }
  return "";
}
function startRecordingFlow(){
  recErrorMsg = null; recDataUrl = null; recFreq = null; recResult = null; recSamples = null;
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.MediaRecorder){
    recErrorMsg = T("Запись звука не поддерживается в этом браузере. Откройте приложение в Chrome.");
    render(); return;
  }
  navigator.mediaDevices.getUserMedia({ audio:{ echoCancellation:false, noiseSuppression:false, autoGainControl:false } })
    .then(function(stream){
      recStream = stream;
      var mime = pickMimeType();
      try{
        recMediaRecorder = mime ? new MediaRecorder(stream, { mimeType: mime, audioBitsPerSecond: 48000 }) : new MediaRecorder(stream);
      }catch(e){
        recMediaRecorder = new MediaRecorder(stream);
      }
      recChunks = [];
      recMediaRecorder.ondataavailable = function(e){ if(e.data && e.data.size>0) recChunks.push(e.data); };
      recMediaRecorder.onstop = function(){ finishRecording(); };
      recMediaRecorder.start();
      recState = "recording"; recStart = performance.now();
      vibrate(25);
      render();
      tickRecordingProgress();
      recTimer = setTimeout(function(){ if(recState==="recording") stopRecordingNow(); }, REC_MAX_MS);
    })
    .catch(function(err){
      recErrorMsg = F(T("Микрофон не запустился: {0}. Разрешите приложению доступ к микрофону и попробуйте снова."), describeMicError(err));
      render();
    });
}
function tickRecordingProgress(){
  if(recState!=="recording") return;
  var elapsed = performance.now()-recStart;
  var pct = Math.min(100, (elapsed/REC_MAX_MS)*100);
  var fill = document.getElementById("recFill");
  if(fill) fill.style.width = pct+"%";
  recRafId = requestAnimationFrame(tickRecordingProgress);
}
function stopRecordingNow(){
  if(recTimer){ clearTimeout(recTimer); recTimer=null; }
  if(recRafId){ cancelAnimationFrame(recRafId); recRafId=null; }
  if(recMediaRecorder && recMediaRecorder.state !== "inactive"){ recMediaRecorder.stop(); }
  if(recStream){ recStream.getTracks().forEach(function(t){t.stop();}); recStream=null; }
  recState = "processing";
  render();
}
function finishRecording(){
  var mime = (recMediaRecorder && recMediaRecorder.mimeType) || "audio/webm";
  var blob = new Blob(recChunks, { type: mime });
  var reader = new FileReader();
  reader.onload = function(){
    recDataUrl = reader.result;
    var range = getSearchRange(curSize());
    blob.arrayBuffer().then(function(buf){
      decodeToSamples(buf, function(smp){
        recSamples = smp;
        recResult = smp ? analyzeSamples(smp.data, smp.sr, range) : null;
        recFreq = recResult ? recResult.freq : null;
        recState = "done";
        vibrate(45);
        render();
      });
    }).catch(function(){ recState = "done"; render(); });
  };
  reader.readAsDataURL(blob);
}
function decodeToSamples(arrayBuf, cb){
  var Ctx = window.AudioContext || window.webkitAudioContext, ctx = null, finished = false;
  function fin(v){ if(finished) return; finished = true; try{ if(ctx) ctx.close(); }catch(e){} cb(v); }
  try{
    ctx = new Ctx();
    ctx.decodeAudioData(arrayBuf, function(ab){
      fin({ data: new Float32Array(ab.getChannelData(0)), sr: ab.sampleRate });
    }, function(){ fin(null); });
  }catch(e){ fin(null); }
}
function dataUrlToArrayBuffer(url){
  var b64 = String(url).split(",")[1] || "", bin = atob(b64), u8 = new Uint8Array(bin.length);
  for(var i=0;i<bin.length;i++){ u8[i] = bin.charCodeAt(i); }
  return u8.buffer;
}
function resetRecording(){ recState="idle"; recDataUrl=null; recFreq=null; recResult=null; recSamples=null; recErrorMsg=null; }
function playDataUrl(url){ if(!url) return; try{ new Audio(url).play(); }catch(e){} }

/* эталон из версии 2.2 и раньше: досчитать затухание и чистоту тона по сохранённой записи */
var refJobs = {};
function ensureRefMetrics(size){
  if(!size || size.refDecayState || !size.refAudio || !size.target || refJobs[size.id]) return;
  var id = size.id;
  refJobs[id] = true;
  function done(res){
    delete refJobs[id];
    var s = sizeById(id);
    if(!s) return;
    s.refPurity = (res && res.freq) ? res.purity : null;
    s.refDecay = res ? res.decayMs : null;
    s.refDecayState = res ? res.decayState : "none";
    saveState();
    if(!listening) render();
  }
  try{
    decodeToSamples(dataUrlToArrayBuffer(size.refAudio), function(smp){
      done(smp ? analyzeSamples(smp.data, smp.sr, getSearchRange(size), size.target) : null);
    });
  }catch(e){ done(null); }
}

/* ===================== reference tone generator ===================== */
var toneCtx = null;
function ensureToneCtx(){
  if(!toneCtx){ toneCtx = new (window.AudioContext||window.webkitAudioContext)(); }
  if(toneCtx.state === "suspended"){ toneCtx.resume(); }
  return toneCtx;
}
function playTone(freq){
  try{
    var ctx = ensureToneCtx();
    var now = ctx.currentTime;
    var dur = 1.8;
    var osc = ctx.createOscillator();
    osc.type = "sine";
    osc.frequency.setValueAtTime(freq, now);
    var gain = ctx.createGain();
    gain.gain.setValueAtTime(0, now);
    gain.gain.linearRampToValueAtTime(0.3, now+0.02);
    gain.gain.setValueAtTime(0.3, now+dur-0.25);
    gain.gain.linearRampToValueAtTime(0, now+dur);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(now);
    osc.stop(now+dur+0.05);
  }catch(e){}
}

/* ===================== per-size measurement log ===================== */
var LOG_MAX = 2000;
var noToneAt = 0;
function getLog(size){ return (size && Array.isArray(size.log)) ? size.log : []; }
function pushLogEntry(size, entry){
  if(!size) return;
  if(!Array.isArray(size.log)) size.log = [];
  size.log.unshift(entry);
  if(size.log.length > LOG_MAX) size.log.length = LOG_MAX;
  saveState();
}
function curThr(){
  var t = state.thresholds || {};
  return { decayRel: t.decayRel != null ? t.decayRel : DECAY_REL_MIN,
           purityRel: t.purityRel != null ? t.purityRel : PURITY_REL_MIN,
           purityAbs: t.purityAbs != null ? t.purityAbs : PURITY_ABS_MIN };
}
function refOf(size){
  return { target:size.target, tol:size.tolerance||3, refPurity:size.refPurity, refDecay:size.refDecay, refDecayState:size.refDecayState, thr:curThr() };
}
/* текущее показание: последний удар или среднее по трём */
function currentReading(size){
  var log = getLog(size);
  var n = (state.avgTaps===3) ? Math.min(3, log.length) : (log.length ? 1 : 0);
  if(!n) return null;
  var items = log.slice(0, n), sum = 0, pur = [], dec = [];
  items.forEach(function(h){
    sum += h.freq;
    if(h.purity != null) pur.push(h.purity);
    if(h.decayMs != null && (h.decayState === "ok" || h.decayState === "long")) dec.push(h);
  });
  var m = { n:n, freq:sum/n, purity: pur.length ? medianOf(pur) : null, decayMs:null, decayState:"none" };
  if(dec.length){
    m.decayMs = medianOf(dec.map(function(h){ return h.decayMs; }));
    m.decayState = dec.every(function(h){ return h.decayState === "long"; }) ? "long" : "ok";
  }else if(items[0].decayState){
    m.decayState = items[0].decayState;
    m.decayMs = items[0].decayMs;
  }
  m.verdict = size.target ? judgeTap(m, refOf(size)) : null;
  return m;
}
function entryVerdict(h, size){
  if(h.verdict) return h.verdict;
  var tg = h.target || size.target;
  return tg ? judgeTap({ freq:h.freq }, { target:tg, tol:h.tol || size.tolerance || 3 }) : null;
}
function journalStats(){
  var st = { n:0, ok:0, out:0, bad:0 };
  state.sizes.forEach(function(s){
    getLog(s).forEach(function(h){
      st.n++;
      var v = entryVerdict(h, s);
      if(v === "tuned") st.ok++;
      else if(v === "loose" || v === "tight") st.out++;
      else if(v) st.bad++;
    });
  });
  return st;
}
function exportJournalCSV(){

  var lines = [[T("Дата"), T("Время"), T("Размер"), T("Частота, Гц"), T("Эталон, Гц"), T("Отклонение, %"), T("Допуск, %"),
    T("Затухание, с"), T("Эталон затухания, с"), T("Чистота тона, %"), T("Вердикт")].map(function(c){ return csvCell(c, sep); }).join(sep)];
  rows.forEach(function(r){
    var h = r.h, s = r.s, d = new Date(h.ts), tg = h.target || s.target, tol = h.tol || s.tolerance || 3;
    var vi = verdictInfo(entryVerdict(h, s)), dec = "";
    if(h.decayMs != null && h.decayState === "ok") dec = num(h.decayMs/1000, 2);

      pad2(d.getHours())+":"+pad2(d.getMinutes())+":"+pad2(d.getSeconds()),

      dec, h.refDecay != null ? num(h.refDecay/1000, 2) : "", h.purity != null ? Math.round(h.purity*100) : "",

/* ---------- recorder panel markup (shared) ---------- */
function renderRecorderPanel(context){
  // context: "ref" (setting a fresh reference) | "update" (re-recording existing reference)
  var html = '<div class="frame rec-card">';
  if(recErrorMsg){ html += '<div class="mic-error">'+escapeHtml(recErrorMsg)+'</div>'; }

  if(recState==="idle"){
    html += '<p style="margin:0 0 12px;font-size:12.5px;color:var(--ink-muted);">'+T("Ударьте шестигранным ключом 4–5 мм по центру правильно натянутого шнура — перпендикулярно шнуру, рядом с микрофоном — и дайте звуку затихнуть. Каждый раз используйте тот же ключ и ту же точку удара: с этой записью будут сравниваться все проверки.")+'</p>'+
      '<button class="btn block lg" id="btnStartRec">'+T("🎙 Записать образец (3 сек)")+'</button>'+
      '<div style="text-align:center;margin:12px 0;color:var(--ink-muted);font-size:11.5px;">'+T("— или —")+'</div>'+
      '<button class="btn secondary block" id="btnImportSample">'+T("⬆ Загрузить образец из файла")+'</button>'+
      '<input type="file" id="importSampleFile" accept="application/json,.json" style="display:none;">';
  }else if(recState==="recording"){
    html += '<div style="text-align:center;"><span class="rec-dot"></span>'+T("Идёт запись — ударьте по центру шнура и дайте звуку затихнуть")+'</div>'+
      '<div class="rec-progress"><div class="rec-progress-fill" id="recFill"></div></div>'+
      '<button class="btn danger block" id="btnStopRec" style="margin-top:10px;">'+T("⏹ Остановить")+'</button>';
  }else if(recState==="processing"){
    html += '<div style="text-align:center;color:var(--ink-muted);">'+T("Обработка записи…")+'</div>';
  }else if(recState==="done"){
    html += '<div class="verdict '+(recFreq?"tuned":"idle")+'">'+
      (recFreq ? F(T("Определено: {0} Гц"), fmtHz(recFreq)) : T("Не удалось определить высоту тона — укажите Гц вручную")) + '</div>';
    if(recFreq && recResult){
      html += '<div class="freq-target">'+T("Затухание")+': '+decayText(recResult.decayMs, recResult.decayState)+' · '+T("чистота тона")+': '+Math.round(recResult.purity*100)+'%</div>';
      if(recResult.decayState==="long" && recResult.decayMs < DECAY_MAX_MS){
        html += '<div class="field-hint" style="text-align:center;">'+T("Запись закончилась раньше, чем звук затих: ударьте сразу после начала записи.")+'</div>';
      }
    }
    html += '<div class="rec-result"><audio class="rec-audio" controls src="'+recDataUrl+'"></audio></div>'+
      '<div class="manual-row"><input type="number" min="1" step="0.1" id="recManualFreq" value="'+(recFreq?Math.round(recFreq*10)/10:"")+'" placeholder="'+T("Гц")+'"><button class="btn secondary sm" type="button" id="playManualFreq">▶</button></div>'+
      '<div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;">'+
      '<button class="btn secondary" id="btnRetryRec" style="flex:1 1 auto;">'+T("↺ Заново")+'</button>'+
      '<button class="btn" id="btnSaveRec" style="flex:1 1 auto;" data-ctx="'+context+'">'+T("✓ Сохранить как эталон")+'</button>'+
      '</div>';
  }
  html += '</div>';
  return html;
}

/* ---------- tuner view ---------- */
function renderTonePanel(){
  return '<div class="frame" style="margin-top:14px;">' +
    '<div class="history-title">'+T("Эталонные ноты гитары — для сравнения на слух")+'</div>' +
    '<div style="display:flex;gap:8px;flex-wrap:wrap;">' +
      '<button class="btn secondary tone-btn" data-tone="329.63" style="flex:1;">'+T("▶ 1-я струна · E4 · 329,63 Гц")+'</button>' +
      '<button class="btn secondary tone-btn" data-tone="82.41" style="flex:1;">'+T("▶ 6-я струна · E2 · 82,41 Гц")+'</button>' +
    '</div>' +
    '</div>';
}

function renderMetrics(size, cur){
  var refDecOk = size.refDecay != null && (size.refDecayState === "ok" || size.refDecayState === "long");
  var fast = cur.verdict === "fast" || cur.verdict === "dull";
  var impure = cur.verdict === "rattle" || cur.verdict === "dull";
  var decNum = cur.decayMs != null && (cur.decayState === "ok" || cur.decayState === "long");
  return '<div class="metrics">' +
    '<div class="metric"><div class="m-label">'+T("затухание")+'</div>'+
      '<div class="m-val'+(fast?" bad":"")+(decNum?"":" txt")+'">'+decayText(cur.decayMs, cur.decayState)+'</div>'+
      '<div class="m-ref">'+(refDecOk ? T("эталон")+' '+decayText(size.refDecay, size.refDecayState) : T("эталон не измерен"))+'</div></div>' +
    '<div class="metric"><div class="m-label">'+T("чистота тона")+'</div>'+
      '<div class="m-val'+(impure?" bad":"")+(cur.purity!=null?"":" txt")+'">'+(cur.purity!=null ? Math.round(cur.purity*100)+'%' : '—')+'</div>'+
      '<div class="m-ref">'+(size.refPurity!=null ? T("эталон")+' '+Math.round(size.refPurity*100)+'%' : T("эталон не измерен"))+'</div></div>' +
    '</div>';
}

function renderTuner(){
  var html = topbar(T("Тюнер"), T("Удар — шестигранным ключом по центру шнура, перпендикулярно ему, рядом с микрофоном"));
  var tonePanel = renderTonePanel();

  if(modeSizes().length===0){
    html += emptyState("▭", T("Сначала добавьте размер холста"), T("Выберите готовый слот или добавьте свой на вкладке «Холсты»."),
      '<button class="btn" id="goSizes">'+T("+ Добавить размер")+'</button>');
    html += tonePanel;
    return html;
  }

  var sizes = modeSizes();
  var size = curSize() || sizes[0];
  setSel(size.id);
  ensureRefMetrics(size);

  html += '<div class="size-pick"><select id="sizeSelect">';
  sizes.forEach(function(s){
    html += '<option value="'+s.id+'"'+(s.id===size.id?" selected":"")+'>'+escapeHtml(sizeLabel(s.name))+'</option>';
  });
  html += '</select></div>';

  if(micErrorMsg){ html += '<div class="mic-error">'+escapeHtml(micErrorMsg)+'</div>'; }

  if(size.target == null){
    html += renderRecorderPanel("ref");
    html += tonePanel;
    return html;
  }

  var log = getLog(size);
  var cur = currentReading(size);
  var freq = cur ? cur.freq : null;
  var diffPct = freq ? ((freq - size.target)/size.target*100) : 0;
  var tol = size.tolerance || 3;
  var clamped = Math.max(-30, Math.min(30, diffPct));
  var ptrPct = 50 + (clamped/30)*50;
  var zoneHalfPct = Math.min(50, (tol/30)*50);

  var vi = cur ? verdictInfo(cur.verdict) : null;
  var vCls = vi ? vi.cls : "idle", vIcon = vi ? vi.icon : "◉", vText = vi ? vi.text : T("Ударьте по центру шнура, чтобы измерить");
  if(listening && engineState() === "decay"){
    vCls = "idle"; vIcon = "⏳"; vText = T("Удар принят — слушаю, как затухает звук…");
  }else if(noToneAt && (!log.length || noToneAt > log[0].ts)){
    vCls = "idle"; vIcon = "?"; vText = T("Тон не определился: глухой удар, дребезг или посторонний шум. Ударьте ещё раз.");
  }

  var activeRange = getSearchRange(size);
  var refDecOk = size.refDecay != null && (size.refDecayState === "ok" || size.refDecayState === "long");
  var refHint = "";
  if(!refDecOk && !refJobs[size.id]){
    refHint = '<div class="ref-hint">'+(size.refAudio
      ? T("Затухание эталона измерить не удалось — запишите образец заново, чтобы проверять и затухание.")
      : T("У эталона нет записи звука — запишите образец, чтобы проверять затухание и чистоту тона."))+'</div>';
  }
  html += '<div class="frame tuner-face">' +
    '<div class="freq-readout">'+(freq?fmtHz(freq):"—")+'<span class="freq-unit">'+T("Гц")+'</span></div>' +
    '<div class="freq-target">'+F(T("Эталон: {0} Гц · допуск ±{1}%"), fmtHz(size.target), tol)+
      (state.avgTaps===3 && cur && cur.n>1 ? ' · '+F(T("среднее по {0}"), cur.n) : '') +
      (size.refAudio ? ' <button class="link-btn" id="playRef">'+T("🔊 прослушать эталон")+'</button>' : '') +
      ' <button class="link-btn" id="exportSample">'+T("⬇ экспорт образца")+'</button>' +
    '</div>' +
    (activeRange ? '<div class="freq-target" style="margin-top:2px;">'+F(T("Диапазон поиска: {0}–{1} Гц"), Math.round(activeRange[0]), Math.round(activeRange[1]))+' '+(size.rangeMin!=null&&size.rangeMax!=null?T("(задан вручную)"):T("(авто)"))+'</div>' : '') +
    (cur ? renderMetrics(size, cur) : '') +
    refHint +
    '<div class="gauge">' +
      '<div class="gauge-track">' +
        '<div class="gauge-zone" style="left:'+(50-zoneHalfPct)+'%; width:'+(zoneHalfPct*2)+'%;"></div>' +
        '<div class="gauge-mid"></div>' +
        '<div class="gauge-ptr" style="left:'+ptrPct+'%;"></div>' +
      '</div>' +
      '<div class="gauge-labels"><span>'+T("слабее")+'</span><span>'+T("туже")+'</span></div>' +
    '</div>' +
    '<div class="verdict '+vCls+'" id="verdictBox">'+vIcon+' '+vText+'</div>' +
    '<div class="osc-wrap"><div class="osc-label">'+T("сигнал с микрофона")+'</div><canvas class="osc-canvas" id="oscCanvas" width="300" height="52"></canvas></div>' +
    '<div class="sens-row">' +
      Object.keys(SENS).map(function(k){
        return '<div class="sens-chip'+(state.sensitivity===k?" active":"")+'" data-sens="'+k+'">'+SENS[k].label+'</div>';
      }).join("") +
    '</div>' +
    '<div class="sens-row">' +
      '<div class="sens-chip'+(state.avgTaps===1?" active":"")+'" data-avg="1">'+T("1 удар")+'</div>' +
      '<div class="sens-chip'+(state.avgTaps===3?" active":"")+'" data-avg="3">'+T("Среднее по 3")+'</div>' +
    '</div>' +
    '<div class="mic-controls">' +
      (listening
        ? '<button class="btn danger block lg" id="btnStop">'+T("Остановить")+'</button>'
        : '<button class="btn block lg" id="btnListen">'+T("🎙 Слушать и сравнивать")+'</button>') +
    '</div>' +
    '<div class="mic-note">'+T("Если телефон не спрашивает доступ к микрофону, разрешите его в настройках браузера или приложения — подробнее в инструкции.")+'</div>' +
    '</div>';

  if(log.length){
    html += '<div class="frame history">' +
      '<div class="history-title" style="display:flex;justify-content:space-between;align-items:center;gap:8px;">'+
      '<span>'+F(T("Журнал замеров · {0}"), log.length)+'</span>'+
      '<span style="display:flex;gap:14px;"><button class="link-btn" id="exportCsvTuner" style="font-size:11px;padding:0;">⬇ CSV</button>'+
      '<button class="link-btn" id="clearHistory" style="font-size:11px;padding:0;">'+T("Очистить")+'</button></span></div>';
    log.slice(0,8).forEach(function(h, idx){
      var tg = h.target || size.target;
      var d = Math.round((h.freq-tg)/tg*100);
      var sign = d>0 ? "+" : "";
      var v = verdictInfo(entryVerdict(h, size));
      var decOk = h.decayMs != null && (h.decayState === "ok" || h.decayState === "long");
      html += '<div class="hist-row">'+
        '<span class="h-time">'+fmtDateTime(h.ts)+'</span>'+
        '<span>'+fmtHz(h.freq)+' '+T("Гц")+'</span>'+
        '<span>'+sign+d+'%</span>'+
        '<span class="h-dec">'+(decOk ? (h.decayState==="long"?"&gt;":"")+fmtSec(h.decayMs)+' '+T("с") : '—')+'</span>'+
        '<span class="h-v '+(v?v.cls:"")+'" title="'+(v?escapeHtml(v.short):"")+'">'+(v?v.icon:"")+'</span>'+
        '<button class="h-del" data-del-tap="'+idx+'" aria-label="'+T("Удалить замер")+'">✕</button></div>';
    });
    if(log.length>8){ html += '<div style="text-align:center;font-size:11.5px;color:var(--ink-muted);padding-top:6px;">'+F(T("и ещё {0}…"), log.length-8)+'</div>'; }
    html += '</div>';
  }

  html += recorderOpen
    ? ('<div style="margin-top:14px;">'+renderRecorderPanel("update")+'</div>')
    : ('<div style="margin-top:14px; display:flex; flex-wrap:wrap; gap:8px;">'+
       '<button class="btn secondary" style="flex:1 1 auto;" id="openRecorder">'+T("🎙 Записать новый образец")+'</button>'+
       '<button class="btn danger" style="flex:1 1 auto;" id="deleteRef">'+T("🗑 Удалить эталон")+'</button>'+
       '</div>');
  html += tonePanel;
  return html;
}

/* ---------- sizes view ---------- */
function renderSizes(){
  var html = topbar(T("Холсты"), F(T("Сохранено размеров: {0}"), modeSizes().length));

  html += '<div class="section-title">'+T("Основные размеры · нажмите, чтобы заполнить слот")+'</div>';
  html += '<div class="slot-grid">';
  PRESET_SIZES.forEach(function(name){
    var existing = state.sizes.find(function(s){ return s.name===name; });
    var added = !!existing;
    var tuned = added && existing.target!=null;
    html += '<div class="slot'+(added?" added":"")+(tuned?" tuned":"")+'" data-slot="'+escapeHtml(name)+'">'+
      (added ? '<button class="slot-del" data-del-slot="'+existing.id+'" aria-label="'+T("Удалить слот")+'" title="'+T("Удалить")+'">✕</button>' : '') +
      '<div class="slot-name">'+escapeHtml(sizeLabel(name))+'</div>'+
      '<div class="slot-status">'+(tuned ? "✓ "+fmtHz(existing.target)+" "+T("Гц") : (added ? T("эталон не задан") : '<span class="slot-plus">'+T("+ добавить")+'</span>'))+'</div>'+
      '</div>';
  });
  html += '</div>';

  var custom = modeSizes().filter(function(s){ return PRESET_SIZES.indexOf(s.name)===-1; });
  html += '<div class="section-title">'+T("Другие размеры")+'</div>';
  html += '<div class="toolbar"><button class="btn sm" id="addSize">'+T("+ Свой размер")+'</button></div>';
  if(custom.length===0){
    html += emptyState("▭", T("Пока нет своих размеров"), T("Добавьте нестандартный размер, если его нет среди основных слотов."));
  }else{
    html += '<div class="size-list">';
    custom.forEach(function(s){
      html += '<div class="frame size-row" data-edit-size="'+s.id+'">'+
        '<div><div class="size-row-name">'+escapeHtml(s.name)+'</div>'+
        '<div class="size-row-meta">'+(s.target!=null ? F(T("Эталон: {0} Гц · допуск ±{1}%"), fmtHz(s.target), (s.tolerance||3)) : T("Эталон не задан"))+'</div></div>'+
        '<span class="chev">›</span></div>';
    });
    html += '</div>';
  }

  var st = journalStats();
  html += '<div class="section-title">'+T("Журнал проверок")+'</div>';
  html += '<div class="frame">' +
    (st.n
      ? '<div class="journal-stats">'+
          '<div><b>'+st.n+'</b><span>'+T("всего")+'</span></div>'+
          '<div class="ok"><b>'+st.ok+'</b><span>'+T("в норме")+'</span></div>'+
          '<div class="out"><b>'+st.out+'</b><span>'+T("вне допуска")+'</span></div>'+
          '<div class="bad"><b>'+st.bad+'</b><span>'+T("брак")+'</span></div>'+
        '</div>'
      : '<div class="field-hint" style="margin:0 0 10px;">'+T("Замеров пока нет.")+'</div>') +
    '<button class="btn secondary block" id="btnExportCsv">'+T("⬇ Выгрузить журнал (CSV)")+'</button>' +
    '<div class="field-hint">'+T("Таблица для Excel: дата, время, размер, частота, отклонение, затухание, чистота тона и вердикт по каждому удару.")+'</div>' +
    '</div>';

  html += '<div class="section-title">'+T("Резервная копия")+'</div>';
  html += '<div class="frame" style="display:flex; gap:8px; flex-wrap:wrap;">' +
    '<button class="btn secondary" id="btnExport" style="flex:1;min-width:140px;">'+T("⬇ Экспорт в файл")+'</button>' +
    '<button class="btn secondary" id="btnImport" style="flex:1;min-width:140px;">'+T("⬆ Импорт из файла")+'</button>' +
    '<input type="file" id="importFile" accept="application/json,.json" style="display:none;">' +
    '</div>';

  return html;
}

function openSizeForm(sizeId){

    '<div class="field"><label>'+T("Название размера")+'</label><input id="sz_name" type="text" placeholder="'+T("Например: подрамник 45×55")+'" value="'+escapeHtml(s?s.name:"")+'"></div>' +

      '<div><label>'+T("Эталон, Гц")+'</label><div style="display:flex;gap:6px;"><input id="sz_target" type="number" min="1" step="0.1" value="'+(s&&s.target!=null?s.target:"")+'" placeholder="'+T("не задан")+'" style="flex:1;"><button class="btn secondary sm" type="button" id="playSzTarget">▶</button></div></div>' +
      '<div><label>'+T("Допуск, %")+'</label><input id="sz_tol" type="number" min="1" max="30" step="1" value="'+(s?(s.tolerance||3):3)+'"></div>' +
    '</div>' +
    '<div class="field-hint" style="margin:-6px 0 14px;">'+T("Допуск задаётся по частоте: ±3% по частоте ≈ ±6% по натяжению, потому что частота растёт как корень из натяжения.")+'</div>' +
    '<div class="field"><label>'+T("Диапазон поиска частоты, Гц")+'</label>' +
      '<div class="field-row">' +
        '<input id="sz_rmin" type="number" min="20" step="1" value="'+(s&&s.rangeMin!=null?s.rangeMin:"")+'" placeholder="'+T("авто")+'">' +
        '<input id="sz_rmax" type="number" min="21" step="1" value="'+(s&&s.rangeMax!=null?s.rangeMax:"")+'" placeholder="'+T("авто")+'">' +
      '</div>' +
      '<div class="field-hint">'+T("По умолчанию приложение само сужает поиск вокруг эталона. Задайте вручную, если слышите чужой тон или эталон ещё не записан.")+'</div>' +
    '</div>';
  var foot = '<button class="btn secondary" id="sz_cancel">'+T("Отмена")+'</button>';
  if(editing) foot += '<button class="btn danger" id="sz_delete">'+T("Удалить")+'</button>';
  foot += '<button class="btn" id="sz_save">'+(editing?T("Сохранить"):T("Добавить"))+'</button>';
  openDrawer(editing?T("Изменить размер"):T("Новый размер"), body, foot);

  document.getElementById("sz_cancel").addEventListener("click", closeDrawer);
  var playSzTarget = document.getElementById("playSzTarget");
  if(playSzTarget) playSzTarget.addEventListener("click", function(){
    var v = Number(document.getElementById("sz_target").value);
    if(v>0) playTone(v);
  });
  if(editing){
    document.getElementById("sz_delete").addEventListener("click", function(){
      if(!confirm(F(T("Удалить размер «{0}»?"), s.name))) return;
      state.sizes = state.sizes.filter(function(x){return x.id!==s.id;});
      fixSelection();
      saveState(); closeDrawer(); render();
    });
  }
  document.getElementById("sz_save").addEventListener("click", function(){
    var name = document.getElementById("sz_name").value.trim();
    if(!name){ document.getElementById("sz_name").focus(); return; }
    var tRaw = document.getElementById("sz_target").value;
    var rMinRaw = document.getElementById("sz_rmin").value;
    var rMaxRaw = document.getElementById("sz_rmax").value;

    var rMax = rMaxRaw==="" ? null : Number(rMaxRaw);
    if(rMin!=null && rMax!=null && rMin>=rMax){

    }
    var newTarget = tRaw==="" ? null : Number(tRaw);
    var payload = {
      name: name,
      target: newTarget,

    };
    if(editing){

      Object.assign(s, payload);
    }

    saveState(); closeDrawer(); render();
  });

function onTapEvent(ev){
  var size = curSize();
  if(ev.type === "decay-start"){ render(); return; }
  if(ev.type === "notone"){ noToneAt = Date.now(); vibrate(20); render(); return; }
  var entry = { ts: Date.now(), freq: ev.freq, purity: ev.purity, decayMs: ev.decayMs, decayState: ev.decayState };
  if(size && size.target){
    entry.target = size.target;
    entry.tol = size.tolerance || 3;
    entry.refDecay = size.refDecay != null ? size.refDecay : null;
    entry.verdict = judgeTap(ev, refOf(size));
  }
  lastReading = entry;
  pushLogEntry(size, entry);
  noToneAt = 0;
  var cur = size ? currentReading(size) : null;
  var v = cur ? cur.verdict : null;
  if(v === "tuned") vibrate(70);
  else if(v === "loose" || v === "tight") vibrate([40,50,40]);
  else if(v) vibrate([40,50,40,50,40]);
  else vibrate(30);
  render();
}

/* ===================== ПРО: реестр проверок по регламенту ===================== */
/* Режим «Про» ведёт реестр проверок изделий: заказ, длина стороны со шнуром, исполнитель, паспорт ключа,
   результат первичной проверки, корректировка и повторная проверка. Записи хранятся отдельно от размеров
   (IndexedDB; если она недоступна — localStorage) и не удаляются: ошибочная проверка исправляется новой проверкой. */
/*i18n-off*/
var REG_DB = "natyazhka-registry", REG_STORE = "records", REG_LS = "natyazhka_registry_v1";
var SUPPORT_EMAIL = "zaymozay@gmail.com";
var PRESET_SIDES = [20, 30, 40, 50, 60, 70, 80, 90, 100, 110, 120];
var SIDE_NAME_SUFFIX = " см";   /* имена длин хранятся по-русски, как имена слотов */
/*i18n-on*/
var registry = [];
var regReady = false, regBackend = "none", regDb = null;

function NO_SIGN(){ return LANG === "en" ? "No." : "№"; }
function sortReg(){ registry.sort(function(a,b){ return ((a.no||0) - (b.no||0)) || (a.ts - b.ts); }); }
function regLsSave(){
  try{ localStorage.setItem(REG_LS, JSON.stringify(registry)); return true; }
  catch(e){ notify(T("Не удалось сохранить запись реестра: память телефона заполнена. Сохраните резервную копию.")); return false; }
}
function regInit(cb){
  var done = false;
  function finish(){ if(done) return; done = true; sortReg(); regReady = true; syncNextNo(); if(cb) cb(); }
  function fallback(){
    if(done) return;
    regBackend = "ls";
    try{ registry = JSON.parse(localStorage.getItem(REG_LS) || "[]"); if(!Array.isArray(registry)) registry = []; }catch(e){ registry = []; }
    finish();
  }
  try{
    if(!window.indexedDB){ fallback(); return; }
    var req = indexedDB.open(REG_DB, 1);
    req.onupgradeneeded = function(){
      var db = req.result;
      if(!db.objectStoreNames.contains(REG_STORE)) db.createObjectStore(REG_STORE, { keyPath: "id" });
    };
    req.onerror = fallback;
    req.onsuccess = function(){
      regDb = req.result; regBackend = "idb";
      try{
        var r = regDb.transaction(REG_STORE, "readonly").objectStore(REG_STORE).getAll();
        r.onsuccess = function(){
          registry = r.result || [];
          /* записи, сохранённые раньше в localStorage (когда IndexedDB была недоступна), переносим в IndexedDB */
          var ls = null;
          try{ ls = JSON.parse(localStorage.getItem(REG_LS) || "null"); }catch(e){}
          if(Array.isArray(ls) && ls.length){
            regMerge(ls, function(){ try{ localStorage.removeItem(REG_LS); }catch(e){} });
          }
          finish();
        };
        r.onerror = fallback;
      }catch(e){ fallback(); }
    };
  }catch(e){ fallback(); }
}
function syncNextNo(){
  var maxNo = registry.reduce(function(m, r){ return Math.max(m, r.no || 0); }, 0);
  if(!state.pro.nextNo || state.pro.nextNo <= maxNo){ state.pro.nextNo = maxNo + 1; saveState(); }
}
function regWrite(recs, cb){
  if(regBackend === "idb" && regDb){
    try{
      var tx = regDb.transaction(REG_STORE, "readwrite"), st = tx.objectStore(REG_STORE);
      recs.forEach(function(r){ st.put(r); });
      tx.oncomplete = function(){ if(cb) cb(true); };
      tx.onerror = tx.onabort = function(){
        notify(T("Не удалось сохранить запись реестра. Сохраните резервную копию и перезапустите приложение."));
        if(cb) cb(false);
      };
    }catch(e){
      notify(T("Не удалось сохранить запись реестра. Сохраните резервную копию и перезапустите приложение."));
      if(cb) cb(false);
    }
  }else{
    var ok = regLsSave();
    if(cb) cb(ok);
  }
}
function regAdd(rec, cb){ registry.push(rec); sortReg(); regWrite([rec], cb); }
/* записи из файла или старого хранилища проверяются: известные статусы и причины, числа — числами */
var RESULTS = ["pass", "fail", "aborted"];
var REASONS = ["loose", "tight", "fast", "rattle", "dull", "notone", "sag", "noisy", "interrupted", "abort"];
function cleanRec(r){
  if(!r || typeof r !== "object" || typeof r.id !== "string" || !/^[A-Za-z0-9_-]{1,64}$/.test(r.id)) return null;
  if(typeof r.ts !== "number" || !isFinite(r.ts) || RESULTS.indexOf(r.result) < 0) return null;
  function str(v){ return v == null ? null : String(v); }
  function num(v){ return (v == null || v === "" || !isFinite(Number(v))) ? null : Number(v); }
  r.no = num(r.no) || 0; r.side = num(r.side) || 0; r.attempt = num(r.attempt) || 1; r.prevNo = num(r.prevNo);
  r.order = String(r.order == null ? "" : r.order); r.item = itemKey(r.order, r.side);
  r.reasons = Array.isArray(r.reasons) ? r.reasons.filter(function(c){ return REASONS.indexOf(c) >= 0; }) : [];
  ["prev", "correction", "operator", "toolId", "v", "acoustic", "sag", "action", "decayState"].forEach(function(k){ r[k] = str(r[k]); });
  ["freq", "dev", "decayMs", "purity", "toolMass"].forEach(function(k){ r[k] = num(r[k]); });
  if(r.ref && typeof r.ref === "object"){
    ["target", "tol", "decay", "purity", "recordedAt"].forEach(function(k){ r.ref[k] = num(r.ref[k]); });
    r.ref.decayState = str(r.ref.decayState); r.ref.toolId = str(r.ref.toolId);
  }else r.ref = null;
  if(r.thr && typeof r.thr === "object"){
    var t = {}; ["decayRel", "purityRel", "purityAbs"].forEach(function(k){ var v = num(r.thr[k]); if(v != null) t[k] = v; }); r.thr = t;
  }else r.thr = null;
  return r;
}
function regMerge(list, cb){
  var have = {};
  registry.forEach(function(r){ have[r.id] = true; });
  var add = [];
  (list || []).forEach(function(x){ var r = cleanRec(x); if(r && !have[r.id]){ have[r.id] = true; add.push(r); } });
  add.forEach(function(r){ registry.push(r); });
  sortReg();
  syncNextNo();
  if(!add.length){ if(cb) cb(0); return; }
  regWrite(add, function(){ if(cb) cb(add.length); });
}
function requestPersistentStorage(){
  try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(function(){}); }catch(e){}
}
function newRecId(){ return "r" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

/* прежние эталоны не теряются: при замене или удалении их данные уходят в историю длины */
function archiveRef(size){
  if(!size || size.target == null) return;
  if(!Array.isArray(size.refHistory)) size.refHistory = [];
  size.refHistory.unshift({ target:size.target, tol:size.tolerance || 3, decay:size.refDecay, decayState:size.refDecayState,
    purity:size.refPurity, recordedAt:size.refRecordedAt || null, toolId:size.refToolId || null, toolMass:size.refToolMass || null,
    operator:size.refOperator || null, audioName: size.refAudio ? refAudioName(size) : null, replacedAt: Date.now() });
  if(size.refHistory.length > 50) size.refHistory.length = 50;
}
