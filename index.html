<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#A78BD6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="НАТЯЖКА">
<title>НАТЯЖКА — тюнер холста</title>
<link rel="apple-touch-icon" id="appleTouchIcon" href="">
<style>
  :root{
    --bg:#F4F2FA;
    --surface:#FFFFFF;
    --surface-2:#F1EDF9;
    --border:#E2DBF1;
    --ink:#332C46;
    --ink-muted:#8A81A0;
    --accent:#A487D6;
    --accent-fg:#FFFFFF;
    --accent-soft:#EDE4FA;
    --loose:#6E96C9;   --loose-bg:#E2ECF9;
    --tuned:#5CAE84;   --tuned-bg:#E1F3E8;
    --tight:#D97EA3;   --tight-bg:#FAE3ED;
    --radius:14px;
    --radius-sm:10px;
    --safe-t: env(safe-area-inset-top, 0px);
    --safe-b: env(safe-area-inset-bottom, 0px);
  }
  :root[data-theme="dark"]{
    --bg:#211C2E; --surface:#2A2438; --surface-2:#312A42; --border:#443A59;
    --ink:#EDE9F5; --ink-muted:#A79BC2;
    --accent:#BFA3E8; --accent-fg:#221A33; --accent-soft:#3B3050;
    --loose:#8FB4E0; --loose-bg:#293852;
    --tuned:#8AD1A9; --tuned-bg:#1F3A2C;
    --tight:#E8A2C0; --tight-bg:#452A38;
  }
  html{ height:100%; scroll-padding-top:var(--safe-t); }
  *{ box-sizing:border-box; }
  body{
    margin:0; height:100%; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;
    padding-top:var(--safe-t); padding-bottom:var(--safe-b);
    overflow-x:hidden;
  }
  button,input,select,textarea{ font-family:inherit; font-size:inherit; color:inherit; }

  .shell{ display:flex; min-height:100vh; }
  .rail{
    width:216px; flex-shrink:0; background:var(--surface); border-right:1px solid var(--border);
    display:flex; flex-direction:column; padding:22px 14px; position:sticky; top:0; height:100vh;
  }
  .brand-mark{ font-size:19px; font-weight:800; letter-spacing:0.08em; color:var(--accent); }
  .brand-sub{ font-size:11px; color:var(--ink-muted); margin:2px 0 20px; }
  .nav{ display:flex; flex-direction:column; gap:2px; }
  .nav-btn{
    display:flex; align-items:center; gap:10px; background:none; border:none; text-align:left;
    cursor:pointer; padding:10px 12px; border-radius:var(--radius-sm); color:var(--ink-muted); font-size:13.5px; font-weight:600;
  }
  .nav-btn:hover{ background:var(--surface-2); color:var(--ink); }
  .nav-btn.active{ background:var(--accent-soft); color:var(--accent); }
  .nav-ico{ width:18px; text-align:center; }
  .rail-foot{ margin-top:auto; padding-top:14px; border-top:1px solid var(--border); display:flex; flex-direction:column; gap:10px; }
  .theme-toggle{ display:flex; gap:4px; background:var(--surface-2); border-radius:var(--radius-sm); padding:3px; }
  .theme-btn{ flex:1; border:none; background:none; padding:6px 4px; border-radius:8px; color:var(--ink-muted); cursor:pointer; font-size:11.5px; }
  .theme-btn.active{ background:var(--surface); color:var(--ink); box-shadow:0 0 0 1px var(--border); }
  .install-btn{
    display:flex; align-items:center; justify-content:center; gap:6px; background:var(--accent-soft); color:var(--accent);
    border:none; border-radius:var(--radius-sm); padding:9px 10px; font-weight:700; font-size:12px; cursor:pointer;
  }

  .main{ flex:1; min-width:0; padding:26px 26px 100px; max-width:640px; }
  .mobile-topbar{ display:none; }
  .topline{ margin-bottom:18px; }
  .view-title{ font-size:20px; font-weight:800; letter-spacing:-0.01em; }
  .view-sub{ color:var(--ink-muted); font-size:12.5px; margin-top:2px; }

  .frame{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:18px; }

  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
    background:var(--accent); color:var(--accent-fg); border:none; padding:11px 18px;
    border-radius:var(--radius-sm); font-weight:700; font-size:13.5px; cursor:pointer; white-space:nowrap;
  }
  .btn:hover{ opacity:0.92; }
  .btn.secondary{ background:var(--surface-2); color:var(--ink); }
  .btn.danger{ background:var(--tight); color:#fff; }
  .btn.block{ width:100%; }
  .btn.lg{ padding:15px 20px; font-size:14.5px; }
  .btn.sm{ padding:7px 12px; font-size:12.5px; }

  .empty{ text-align:center; padding:30px 14px; color:var(--ink-muted); }
  .empty-ico{ font-size:24px; margin-bottom:8px; opacity:0.75; }
  .empty-title{ color:var(--ink); font-weight:700; font-size:13.5px; margin-bottom:4px; }
  .empty-text{ font-size:12.5px; margin-bottom:14px; }

  /* -------- tuner screen -------- */
  .size-pick{ margin-bottom:16px; }
  .size-pick select{
    width:100%; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-sm);
    padding:10px 12px; font-weight:700; font-size:14px;
  }
  .tuner-face{ text-align:center; padding:26px 18px 22px; }
  .freq-readout{ font-size:52px; font-weight:800; letter-spacing:-0.02em; font-variant-numeric:tabular-nums; line-height:1; color:var(--accent); }
  .freq-unit{ font-size:16px; font-weight:700; color:var(--ink-muted); margin-left:4px; }
  .freq-target{ font-size:12.5px; color:var(--ink-muted); margin-top:6px; display:flex; align-items:center; justify-content:center; gap:8px; flex-wrap:wrap; }
  .link-btn{ background:none; border:none; color:var(--accent); font-weight:700; font-size:12px; cursor:pointer; padding:2px 4px; }

  .gauge{ margin:22px auto 6px; max-width:340px; }
  .gauge-track{ position:relative; height:10px; background:var(--surface-2); border-radius:10px; overflow:visible; }
  .gauge-zone{ position:absolute; top:0; bottom:0; background:var(--tuned-bg); border-radius:10px; }
  .gauge-mid{ position:absolute; top:-3px; bottom:-3px; width:2px; background:var(--ink-muted); left:50%; }
  .gauge-ptr{
    position:absolute; top:-7px; width:24px; height:24px; margin-left:-12px;
    border-radius:50%; background:var(--accent); box-shadow:0 0 0 3px var(--surface);
    transition:left 0.12s ease;
  }
  .gauge-labels{ display:flex; justify-content:space-between; font-size:11px; color:var(--ink-muted); margin-top:8px; }

  .verdict{
    margin-top:20px; padding:13px 16px; border-radius:var(--radius-sm); font-weight:700; font-size:14px;
    display:flex; align-items:center; justify-content:center; gap:8px;
  }
  .verdict.loose{ background:var(--loose-bg); color:var(--loose); }
  .verdict.tuned{ background:var(--tuned-bg); color:var(--tuned); }
  .verdict.tight{ background:var(--tight-bg); color:var(--tight); }
  .verdict.idle{ background:var(--surface-2); color:var(--ink-muted); font-weight:600; }

  .level-wrap{ display:flex; align-items:center; gap:10px; margin:18px 0 4px; }
  .level-bar{ flex:1; height:6px; background:var(--surface-2); border-radius:6px; overflow:hidden; }
  .level-fill{ height:100%; background:var(--accent); width:0%; transition:width 0.08s linear; }
  .level-label{ font-size:11px; color:var(--ink-muted); width:80px; text-align:right; }

  .sens-row{ display:flex; gap:6px; justify-content:center; margin-top:14px; }
  .sens-chip{
    padding:6px 12px; border-radius:20px; font-size:12px; font-weight:600; cursor:pointer;
    background:var(--surface-2); color:var(--ink-muted);
  }
  .sens-chip.active{ background:var(--accent); color:var(--accent-fg); }

  .mic-controls{ margin-top:20px; }
  .mic-note{ font-size:11.5px; color:var(--ink-muted); margin-top:10px; text-align:center; }
  .mic-error{ background:var(--tight-bg); color:var(--tight); padding:11px 14px; border-radius:var(--radius-sm); font-size:12.5px; margin-top:12px; }

  .history{ margin-top:20px; }
  .history-title{ font-size:11.5px; font-weight:700; text-transform:uppercase; letter-spacing:0.04em; color:var(--ink-muted); margin-bottom:8px; }
  .hist-row{ display:flex; justify-content:space-between; align-items:center; padding:7px 0; border-bottom:1px solid var(--border); font-size:12.5px; }
  .hist-row:last-child{ border-bottom:none; }

  /* -------- recorder panel -------- */
  .rec-card{ margin-top:14px; }
  .rec-card h4{ margin:0 0 6px; font-size:13.5px; }
  .rec-card p{ margin:0 0 12px; font-size:12.5px; color:var(--ink-muted); }
  .rec-progress{ height:8px; background:var(--surface-2); border-radius:8px; overflow:hidden; margin:14px 0 4px; }
  .rec-progress-fill{ height:100%; background:var(--tight); width:0%; transition:width 0.08s linear; }
  .rec-dot{ display:inline-block; width:9px; height:9px; border-radius:50%; background:var(--tight); margin-right:7px; animation:pulse 1s infinite; }
  @keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:0.35;} }
  .rec-result{ display:flex; align-items:center; gap:10px; margin:10px 0 14px; }
  .rec-audio{ flex:1; width:100%; height:36px; }
  .manual-row{ display:flex; gap:8px; margin-top:16px; align-items:center; }
  .manual-row input{
    flex:1; background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius-sm);
    padding:9px 11px;
  }

  /* -------- slots grid -------- */
  .section-title{ font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:0.04em; color:var(--ink-muted); margin:22px 0 10px; }
  .section-title:first-child{ margin-top:0; }
  .slot-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(148px,1fr)); gap:10px; }
  .slot{
    border-radius:var(--radius); padding:14px; cursor:pointer; text-align:left;
    border:1.5px dashed var(--border); background:var(--surface-2);
  }
  .slot.added{ border-style:solid; background:var(--surface); }
  .slot.tuned{ border-color:var(--tuned); }
  .slot-name{ font-weight:700; font-size:13.5px; }
  .slot-status{ font-size:11.5px; color:var(--ink-muted); margin-top:5px; }
  .slot.tuned .slot-status{ color:var(--tuned); font-weight:700; }
  .slot-plus{ font-size:15px; color:var(--accent); font-weight:800; }

  .toolbar{ display:flex; justify-content:flex-end; margin-bottom:14px; }
  .size-list{ display:flex; flex-direction:column; gap:10px; }
  .size-row{ display:flex; align-items:center; justify-content:space-between; padding:14px 16px; cursor:pointer; }
  .size-row-name{ font-weight:700; font-size:14px; }
  .size-row-meta{ font-size:12px; color:var(--ink-muted); margin-top:3px; }
  .chev{ color:var(--ink-muted); font-size:15px; }

  /* -------- drawer -------- */
  .overlay{ position:fixed; inset:0; background:rgba(45,32,70,0.32); z-index:40; opacity:0; pointer-events:none; transition:opacity 0.16s ease; }
  .overlay.open{ opacity:1; pointer-events:auto; }
  .drawer{
    position:fixed; top:0; right:0; height:100%; width:min(420px,100%); background:var(--surface); z-index:41;
    box-shadow:-8px 0 24px rgba(60,40,90,0.14); transform:translateX(100%); transition:transform 0.2s ease;
    display:flex; flex-direction:column;
  }
  .drawer.open{ transform:translateX(0); }
  .drawer-head{ display:flex; align-items:center; justify-content:space-between; padding:18px 20px; border-bottom:1px solid var(--border); }
  .drawer-title{ font-size:15px; font-weight:700; }
  .drawer-close{ background:none; border:none; font-size:18px; color:var(--ink-muted); cursor:pointer; padding:4px; }
  .drawer-body{ padding:18px 20px; overflow-y:auto; flex:1; }
  .drawer-foot{ padding:14px 20px; border-top:1px solid var(--border); display:flex; gap:8px; }

  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:12px; font-weight:700; color:var(--ink-muted); margin-bottom:5px; }
  .field input, .field select{
    width:100%; background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius-sm); padding:9px 11px;
  }
  .field input:focus, .field select:focus{ outline:none; border-color:var(--accent); }
  .field-row{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .field-hint{ font-size:11.5px; color:var(--ink-muted); margin-top:4px; }

  /* -------- install tip toast -------- */
  .toast{
    position:fixed; left:16px; right:16px; bottom:calc(16px + var(--safe-b)); z-index:50;
    background:var(--ink); color:var(--bg); padding:14px 16px; border-radius:var(--radius);
    font-size:12.5px; max-width:420px; margin:0 auto; box-shadow:0 10px 30px rgba(0,0,0,0.2);
    transform:translateY(140%); transition:transform 0.22s ease;
  }
  .toast.open{ transform:translateY(0); }
  .toast b{ display:block; margin-bottom:4px; font-size:13px; }
  .toast-close{ position:absolute; top:8px; right:10px; background:none; border:none; color:var(--bg); opacity:0.7; font-size:14px; cursor:pointer; }

  @media (max-width:820px){
    .rail{
      position:fixed; bottom:0; left:0; right:0; top:auto; width:100%; height:auto; flex-direction:row;
      align-items:center; justify-content:space-around; padding:8px 6px calc(8px + var(--safe-b));
      border-right:none; border-top:1px solid var(--border); z-index:30;
    }
    .brand-mark,.brand-sub,.rail-foot{ display:none; }
    .nav{ flex-direction:row; width:100%; justify-content:space-around; }
    .nav-btn{ flex-direction:column; gap:3px; font-size:10.5px; padding:6px 4px; }
    .nav-ico{ font-size:17px; }
    .main{ padding:16px 14px 96px; max-width:none; }
    .mobile-topbar{ display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
    .mobile-topbar .brand-mark{ font-size:17px; }
    .mobile-topbar .install-btn{ padding:7px 10px; font-size:11.5px; }
    .freq-readout{ font-size:44px; }
  }
</style>
</head>
<body>

<div class="shell">
  <aside class="rail">
    <div class="brand-mark">НАТЯЖКА</div>
    <div class="brand-sub">тюнер натяжения холста</div>
    <nav class="nav" id="nav">
      <button class="nav-btn" data-view="tuner"><span class="nav-ico">◉</span><span>Тюнер</span></button>
      <button class="nav-btn" data-view="sizes"><span class="nav-ico">▭</span><span>Холсты</span></button>
    </nav>
    <div class="rail-foot">
      <button class="install-btn" id="installBtnDesktop">📲 Установить на телефон</button>
      <div class="theme-toggle">
        <button class="theme-btn" data-theme="light">Светлая</button>
        <button class="theme-btn" data-theme="dark">Тёмная</button>
        <button class="theme-btn" data-theme="auto">Авто</button>
      </div>
    </div>
  </aside>
  <main class="main" id="main"></main>
</div>

<div class="overlay" id="overlay"></div>
<div class="drawer" id="drawer">
  <div class="drawer-head">
    <div class="drawer-title" id="drawerTitle">—</div>
    <button class="drawer-close" id="drawerClose">✕</button>
  </div>
  <div class="drawer-body" id="drawerBody"></div>
  <div class="drawer-foot" id="drawerFoot"></div>
</div>

<div class="toast" id="installToast">
  <button class="toast-close" id="toastClose">✕</button>
  <b>Установка на Android</b>
  Chrome → меню (⋮) в правом верхнем углу → «Добавить на главный экран» / «Установить приложение».
</div>

/* ===================== PWA manifest + install ===================== */
(function setupManifest(){
  try{
    var manifest = {
      name: "НАТЯЖКА — тюнер холста",
      short_name: "НАТЯЖКА",
      start_url: location.href,
      scope: location.href,
      display: "standalone",
      background_color: "#F4F2FA",
      theme_color: "#A487D6",
      icons: [
        { src: ICON192, sizes: "192x192", type: "image/png", purpose: "any" },
        { src: ICON512, sizes: "512x512", type: "image/png", purpose: "any" }
      ]
    };
    var blob = new Blob([JSON.stringify(manifest)], { type: "application/manifest+json" });
    var url = URL.createObjectURL(blob);
    var link = document.createElement("link");
    link.rel = "manifest";
    link.href = url;
    document.head.appendChild(link);
  }catch(e){}
  var apple = document.getElementById("appleTouchIcon");
  if(apple) apple.href = ICON512;
  var fav = document.createElement("link");
  fav.rel = "icon"; fav.href = ICON192; fav.type = "image/png";
  document.head.appendChild(fav);
})();

var deferredInstallPrompt = null;
window.addEventListener("beforeinstallprompt", function(e){
  e.preventDefault();
  deferredInstallPrompt = e;
});
function tryInstall(){
  if(deferredInstallPrompt){
    deferredInstallPrompt.prompt();
    deferredInstallPrompt.userChoice.finally(function(){ deferredInstallPrompt=null; });
  }else{
    showToast();
  }
}
function showToast(){ document.getElementById("installToast").classList.add("open"); }
function hideToast(){ document.getElementById("installToast").classList.remove("open"); }
document.getElementById("toastClose").addEventListener("click", hideToast);
document.getElementById("installBtnDesktop").addEventListener("click", tryInstall);

/* ===================== storage ===================== */
var STORE_KEY = "canvas_tension_v2";
var state = { sizes: [], selectedSizeId: null, sensitivity: "normal", avgTaps: 1, seq: 1 };

function loadState(){
  try{
    var raw = localStorage.getItem(STORE_KEY);
    if(raw){
      var p = JSON.parse(raw);
      if(p && typeof p === "object"){
        state.sizes = Array.isArray(p.sizes) ? p.sizes : [];
        state.selectedSizeId = p.selectedSizeId || null;
        state.sensitivity = p.sensitivity || "normal";
        state.avgTaps = (p.avgTaps===3) ? 3 : 1;
        state.seq = typeof p.seq === "number" ? p.seq : 1;
      }
    }else{
      var oldRaw = localStorage.getItem("canvas_tension_v1");
      if(oldRaw){
        var op = JSON.parse(oldRaw);
        if(op && Array.isArray(op.sizes)){
          state.sizes = op.sizes; state.selectedSizeId = op.selectedSizeId||null;
          state.sensitivity = op.sensitivity||"normal"; state.seq = op.seq||1;
        }
      }
    }
  }catch(e){}
  if(!state.selectedSizeId && state.sizes.length){ state.selectedSizeId = state.sizes[0].id; }
}
function saveState(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){}
}
function nextId(){ state.seq++; return "s"+state.seq+"_"+Date.now().toString(36); }
function sizeById(id){ return state.sizes.find(function(s){return s.id===id;}); }

/* ===================== backup: export / import ===================== */
function exportData(){
  try{
    var payload = { app: "canvas-tension-tuner", exportedAt: new Date().toISOString(), state: state };
    var blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
    var url = URL.createObjectURL(blob);

/* ===================== pitch detection (shared) ===================== */
function computeRMS(buf){
  var sum=0;
  for(var i=0;i<buf.length;i++){ sum += buf[i]*buf[i]; }
  return Math.sqrt(sum/buf.length);
}
function autoCorrelate(buf, sampleRate){
  var SIZE = buf.length;
  var rms = computeRMS(buf);
  if(rms < 0.006) return -1;
  var minFreq=45, maxFreq=1500;
  var minLag = Math.floor(sampleRate/maxFreq);
  var maxLag = Math.min(Math.floor(sampleRate/minFreq), SIZE-2);
  if(maxLag <= minLag) return -1;

  var bestLag=-1, bestVal=-Infinity;
  for(var lag=minLag; lag<=maxLag; lag++){
    var sum=0;
    var n = SIZE-lag;
    for(var i=0;i<n;i++){ sum += buf[i]*buf[i+lag]; }
    sum = sum / n;
    if(sum > bestVal){ bestVal=sum; bestLag=lag; }
  }
  if(bestLag<=0) return -1;

  var norm0=0; for(var j=0;j<SIZE;j++){ norm0 += buf[j]*buf[j]; } norm0/=SIZE;
  if(norm0<=0 || bestVal/norm0 < 0.35) return -1;

  var T0=bestLag;
  if(T0>minLag && T0<maxLag){
    var x1=0,x2=0,x3=0;
    for(var k=-1;k<=1;k++){
      var lg=T0+k, s=0, n2=SIZE-lg;
      for(var m=0;m<n2;m++){ s += buf[m]*buf[m+lg]; }
      s/=n2;
      if(k===-1) x1=s; else if(k===0) x2=s; else x3=s;
    }
    var a=(x1+x3-2*x2)/2, b=(x3-x1)/2;
    if(a!==0){ var shift=-b/(2*a); if(Math.abs(shift)<1) T0 = T0+shift; }
  }
  var freq = sampleRate/T0;
  if(freq<minFreq || freq>maxFreq) return -1;
  return freq;
}
function medianOf(arr){
  if(!arr.length) return null;
  var s = arr.slice().sort(function(a,b){return a-b;});
  var mid = Math.floor(s.length/2);
  return s.length%2 ? s[mid] : (s[mid-1]+s[mid])/2;
}

var SENS = {

var CAPTURE_MS = 220, ANALYSIS_INTERVAL = 30;
var audioCtx=null, analyser=null, micStream=null, timeData=null, rafId=null;
var listening=false, engineState="idle", captureBuffer=[], captureStartTime=0, lastAnalysisTime=0;

function describeMicError(err){
  var name = (err && err.name) ? err.name : "UnknownError";
  var msg = (err && err.message) ? err.message : "";
  var known = {
    "NotAllowedError": "доступ отклонён (разрешение не выдано или было отозвано)",
    "PermissionDeniedError": "доступ отклонён (разрешение не выдано)",

    "TrackStartError": "микрофон занят другим приложением или недоступен на уровне системы",
    "OverconstrainedError": "устройство не поддерживает запрошенные параметры записи",

  };
  var explain = known[name] || "неизвестная причина";
  return "["+name+"] "+explain+(msg? " — "+msg : "");
}

function startListening(onTap){
  micErrorMsg = null;
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    micErrorMsg = "Этот браузер не поддерживает доступ к микрофону. Откройте страницу в Chrome.";
    render(); return;
  }
  navigator.mediaDevices.getUserMedia({ audio:{ echoCancellation:false, noiseSuppression:false, autoGainControl:false } })
    .then(function(stream){
      micStream = stream;
      audioCtx = new (window.AudioContext||window.webkitAudioContext)();
      var source = audioCtx.createMediaStreamSource(stream);
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 2048;
      source.connect(analyser);
      timeData = new Float32Array(analyser.fftSize);
      engineState = "quiet"; captureBuffer=[];
      onTapCallback = onTap;
      listening = true;
      acquireWakeLock();
      loop();
      render();
    })
    .catch(function(err){
      micErrorMsg = "Микрофон не запустился: "+describeMicError(err)+". Откройте страницу напрямую по ссылке в Chrome (не во встроенном окне чата).";
      render();
    });
}
function stopListening(){
  listening=false;
  if(rafId) cancelAnimationFrame(rafId);
  rafId=null;
  if(micStream){ micStream.getTracks().forEach(function(t){t.stop();}); micStream=null; }
  if(audioCtx){ try{ audioCtx.close(); }catch(e){} audioCtx=null; }
  analyser=null; engineState="idle"; onTapCallback=null;
  releaseWakeLock();
  render();
}
function loop(){
  if(!listening) return;
  rafId = requestAnimationFrame(loop);
  var now = performance.now();
  if(now-lastAnalysisTime < ANALYSIS_INTERVAL) return;
  lastAnalysisTime = now;
  analyser.getFloatTimeDomainData(timeData);
  var rms = computeRMS(timeData);
  var freq = rms>0.006 ? autoCorrelate(timeData, audioCtx.sampleRate) : -1;

  var cfg = SENS[state.sensitivity];
  if(engineState==="quiet"){
    if(rms > cfg.spike){ engineState="capturing"; captureBuffer=[]; captureStartTime=now; }
  }else if(engineState==="capturing"){
    if(freq>0) captureBuffer.push(freq);
    if(now-captureStartTime >= CAPTURE_MS){
      var result = medianOf(captureBuffer);
      engineState="cooldown";
      if(result && onTapCallback) onTapCallback(result);
    }
  }else if(engineState==="cooldown"){
    if(rms < cfg.quiet) engineState="quiet";
  }
  updateLevelMeter(rms, "levelFill");
}
function updateLevelMeter(rms, elId){
  var fill = document.getElementById(elId);

  var pct = Math.min(100, Math.round((rms/0.12)*100));
  fill.style.width = pct+"%";
}

/* ===================== recorder engine (sample capture + playback) ===================== */
var REC_MAX_MS = 2500;
var recStream=null, recMediaRecorder=null, recChunks=[], recTimer=null, recStart=0, recRafId=null;
var recState = "idle";      // idle | recording | processing | done
var recDataUrl = null, recFreq = null, recErrorMsg = null;

function pickMimeType(){
  var types = ["audio/webm;codecs=opus","audio/webm","audio/mp4","audio/ogg;codecs=opus"];
  for(var i=0;i<types.length;i++){
    if(window.MediaRecorder && MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(types[i])) return types[i];
  }
  return "";
}
function startRecordingFlow(){
  recErrorMsg = null; recDataUrl = null; recFreq = null;
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.MediaRecorder){
    recErrorMsg = "Запись звука не поддерживается в этом браузере. Откройте страницу в Chrome.";
    render(); return;
  }
  navigator.mediaDevices.getUserMedia({ audio:{ echoCancellation:false, noiseSuppression:false, autoGainControl:false } })
    .then(function(stream){
      recStream = stream;
      var mime = pickMimeType();
      try{
        recMediaRecorder = mime ? new MediaRecorder(stream, { mimeType: mime, audioBitsPerSecond: 48000 }) : new MediaRecorder(stream);
      }catch(e){
        recMediaRecorder = new MediaRecorder(stream);
      }
      recChunks = [];
      recMediaRecorder.ondataavailable = function(e){ if(e.data && e.data.size>0) recChunks.push(e.data); };
      recMediaRecorder.onstop = function(){ finishRecording(); };
      recMediaRecorder.start();
      recState = "recording"; recStart = performance.now();
      vibrate(25);
      render();
      tickRecordingProgress();
      recTimer = setTimeout(function(){ if(recState==="recording") stopRecordingNow(); }, REC_MAX_MS);
    })
    .catch(function(err){
      recErrorMsg = "Микрофон не запустился: "+describeMicError(err)+". Откройте страницу напрямую по ссылке в Chrome.";
      render();
    });
}
function tickRecordingProgress(){
  if(recState!=="recording") return;
  var elapsed = performance.now()-recStart;
  var pct = Math.min(100, (elapsed/REC_MAX_MS)*100);
  var fill = document.getElementById("recFill");
  if(fill) fill.style.width = pct+"%";
  recRafId = requestAnimationFrame(tickRecordingProgress);
}
function stopRecordingNow(){
  if(recTimer){ clearTimeout(recTimer); recTimer=null; }
  if(recRafId){ cancelAnimationFrame(recRafId); recRafId=null; }
  if(recMediaRecorder && recMediaRecorder.state !== "inactive"){ recMediaRecorder.stop(); }
  if(recStream){ recStream.getTracks().forEach(function(t){t.stop();}); recStream=null; }
  recState = "processing";
  render();
}
function finishRecording(){
  var mime = (recMediaRecorder && recMediaRecorder.mimeType) || "audio/webm";
  var blob = new Blob(recChunks, { type: mime });
  var reader = new FileReader();
  reader.onload = function(){
    recDataUrl = reader.result;
    estimateFreqFromBlob(blob, function(freq){
      recFreq = freq;
      recState = "done";
      vibrate(45);
      render();
    });
  };
  reader.readAsDataURL(blob);
}
function estimateFreqFromBlob(blob, cb){
  blob.arrayBuffer().then(function(buf){
    var Ctx = window.AudioContext || window.webkitAudioContext;
    var ctx = new Ctx();
    ctx.decodeAudioData(buf.slice(0), function(audioBuffer){
      var data = audioBuffer.getChannelData(0);
      var sr = audioBuffer.sampleRate;
      var winSize = 2048, step = 1024, bestStart = 0, bestRms = -1;
      for(var i=0; i+winSize<=data.length; i+=step){
        var s=0; for(var k=i;k<i+winSize;k++){ s += data[k]*data[k]; }
        var r = Math.sqrt(s/winSize);
        if(r>bestRms){ bestRms=r; bestStart=i; }
      }
      var freq = -1;
      if(bestStart+winSize<=data.length){
        freq = autoCorrelate(data.subarray(bestStart, bestStart+winSize), sr);
      }
      try{ ctx.close(); }catch(e){}
      cb(freq>0 ? freq : null);
    }, function(){ try{ ctx.close(); }catch(e){} cb(null); });
  }).catch(function(){ cb(null); });
}
function resetRecording(){ recState="idle"; recDataUrl=null; recFreq=null; recErrorMsg=null; }

/* ===================== reference tone generator ===================== */
var toneCtx = null;
function ensureToneCtx(){
  if(!toneCtx){ toneCtx = new (window.AudioContext||window.webkitAudioContext)(); }
  if(toneCtx.state === "suspended"){ toneCtx.resume(); }
  return toneCtx;
}
function playTone(freq){
  try{
    var ctx = ensureToneCtx();
    var now = ctx.currentTime;
    var dur = 1.8;
    var osc = ctx.createOscillator();
    osc.type = "sine";
    osc.frequency.setValueAtTime(freq, now);
    var gain = ctx.createGain();
    gain.gain.setValueAtTime(0, now);
    gain.gain.linearRampToValueAtTime(0.3, now+0.02);
    gain.gain.setValueAtTime(0.3, now+dur-0.25);
    gain.gain.linearRampToValueAtTime(0, now+dur);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(now);
    osc.stop(now+dur+0.05);
  }catch(e){}
}

        '<div class="gauge-ptr" style="left:'+ptrPct+'%;"></div>' +
      '</div>' +
      '<div class="gauge-labels"><span>слабее</span><span>туже</span></div>' +
    '</div>' +
    '<div class="verdict '+verdictClass+'">'+verdictIcon+' '+verdictText+'</div>' +
    '<div class="level-wrap"><div class="level-label">уровень звука</div><div class="level-bar"><div class="level-fill" id="levelFill"></div></div></div>' +
    '<div class="sens-row">' +
      Object.keys(SENS).map(function(k){
        return '<div class="sens-chip'+(state.sensitivity===k?" active":"")+'" data-sens="'+k+'">'+SENS[k].label+'</div>';
      }).join("") +
    '</div>' +
    '<div class="sens-row">' +
      '<div class="sens-chip'+(state.avgTaps===1?" active":"")+'" data-avg="1">1 удар</div>' +
      '<div class="sens-chip'+(state.avgTaps===3?" active":"")+'" data-avg="3">Среднее по 3</div>' +
    '</div>' +
    '<div class="mic-controls">' +
      (listening
        ? '<button class="btn danger block lg" id="btnStop">Остановить</button>'
        : '<button class="btn block lg" id="btnListen">🎙 Слушать и сравнивать</button>') +
    '</div>' +
    '<div class="mic-note">Микрофон нужно открыть по прямой ссылке на телефоне — во встроенном окне чата доступ к нему может быть закрыт браузером.</div>' +
    '</div>';

  if(tapHistory.length){
    html += '<div class="frame history">' + '<div class="history-title">Последние замеры</div>';
    tapHistory.slice(0,5).forEach(function(h){
      var d = ((h.freq-size.target)/size.target*100);
      var sign = d>0 ? "+" : "";
      html += '<div class="hist-row"><span>'+fmtTime(h.ts)+'</span><span>'+fmtHz(h.freq)+' Гц</span><span>'+sign+Math.round(d)+'%</span></div>';
    });
    html += '</div>';
  }

  html += '<div style="margin-top:14px;">'+
    (recorderOpen ? renderRecorderPanel("update") :
     '<button class="btn secondary block" id="openRecorder">🎙 Записать новый образец</button>') +
    '</div>';
  html += tonePanel;
  return html;
}

/* ---------- sizes view ---------- */
function renderSizes(){
  var html = topbar("Холсты", state.sizes.length+" размер(ов) сохранено");

  html += '<div class="section-title">Основные размеры · нажмите, чтобы заполнить слот</div>';
  html += '<div class="slot-grid">';
  PRESET_SIZES.forEach(function(name){
    var existing = state.sizes.find(function(s){ return s.name===name; });
    var added = !!existing;
    var tuned = added && existing.target!=null;
    html += '<div class="slot'+(added?" added":"")+(tuned?" tuned":"")+'" data-slot="'+escapeHtml(name)+'">'+
      '<div class="slot-name">'+escapeHtml(name)+'</div>'+
      '<div class="slot-status">'+(tuned ? "✓ "+fmtHz(existing.target)+" Гц" : (added ? "эталон не задан" : '<span class="slot-plus">+ добавить</span>'))+'</div>'+
      '</div>';
  });
  html += '</div>';

  var custom = state.sizes.filter(function(s){ return PRESET_SIZES.indexOf(s.name)===-1; });
  html += '<div class="section-title">Другие размеры</div>';
  html += '<div class="toolbar"><button class="btn sm" id="addSize">+ Свой размер</button></div>';
  if(custom.length===0){
    html += emptyState("▭","Пока нет своих размеров","Добавьте нестандартный размер, если его нет среди основных слотов.");
  }else{
    html += '<div class="size-list">';
    custom.forEach(function(s){
      html += '<div class="frame size-row" data-edit-size="'+s.id+'">'+
        '<div><div class="size-row-name">'+escapeHtml(s.name)+'</div>'+
        '<div class="size-row-meta">'+(s.target!=null ? "Эталон: "+fmtHz(s.target)+" Гц · допуск ±"+(s.tolerance||3)+"%" : "Эталон не задан")+'</div></div>'+
        '<span class="chev">›</span></div>';
    });
    html += '</div>';
  }

  html += '<div class="section-title">Резервная копия</div>';
  html += '<div class="frame" style="display:flex; gap:8px; flex-wrap:wrap;">' +
    '<button class="btn secondary" id="btnExport" style="flex:1;min-width:140px;">⬇ Экспорт в файл</button>' +
    '<button class="btn secondary" id="btnImport" style="flex:1;min-width:140px;">⬆ Импорт из файла</button>' +
    '<input type="file" id="importFile" accept="application/json,.json" style="display:none;">' +
    '</div>';

  return html;
}

/* ===================== drawer: edit custom size ===================== */
var overlay = document.getElementById("overlay");
var drawer = document.getElementById("drawer");
function openDrawer(title, body, foot){
  document.getElementById("drawerTitle").textContent = title;
  document.getElementById("drawerBody").innerHTML = body;
  document.getElementById("drawerFoot").innerHTML = foot;
  overlay.classList.add("open"); drawer.classList.add("open");
}
function closeDrawer(){ overlay.classList.remove("open"); drawer.classList.remove("open"); }
overlay.addEventListener("click", closeDrawer);
document.getElementById("drawerClose").addEventListener("click", closeDrawer);

function openSizeForm(sizeId){
  var editing = !!sizeId;
  var s = editing ? sizeById(sizeId) : null;
  var body =
    '<div class="field"><label>Название размера</label><input id="sz_name" type="text" placeholder="Например: подрамник 45×55" value="'+escapeHtml(s?s.name:"")+'"></div>' +
    '<div class="field field-row">' +
      '<div><label>Эталон, Гц</label><input id="sz_target" type="number" min="1" step="0.1" value="'+(s&&s.target!=null?s.target:"")+'" placeholder="не задан"></div>' +
      '<div><label>Допуск, %</label><input id="sz_tol" type="number" min="1" max="30" step="1" value="'+(s?(s.tolerance||3):3)+'"></div>' +
    '</div>' +
    '<div class="field-hint">Записать эталон по стуку можно на вкладке «Тюнер» после сохранения.</div>';
  var foot = '<button class="btn secondary" id="sz_cancel">Отмена</button>';
  if(editing) foot += '<button class="btn danger" id="sz_delete">Удалить</button>';
  foot += '<button class="btn" id="sz_save">'+(editing?"Сохранить":"Добавить")+'</button>';
  openDrawer(editing?"Изменить размер":"Новый размер", body, foot);

  document.getElementById("sz_cancel").addEventListener("click", closeDrawer);
  if(editing){
    document.getElementById("sz_delete").addEventListener("click", function(){
      if(!confirm("Удалить размер «"+s.name+"»?")) return;
      state.sizes = state.sizes.filter(function(x){return x.id!==s.id;});
      if(state.selectedSizeId===s.id) state.selectedSizeId = state.sizes.length ? state.sizes[0].id : null;
      saveState(); closeDrawer(); render();
    });
  }
  document.getElementById("sz_save").addEventListener("click", function(){
    var name = document.getElementById("sz_name").value.trim();
    if(!name){ document.getElementById("sz_name").focus(); return; }
    var tRaw = document.getElementById("sz_target").value;
    var payload = {
      name: name,
      target: tRaw==="" ? null : Number(tRaw),
      tolerance: Number(document.getElementById("sz_tol").value) || 3
    };
    if(editing){ Object.assign(s, payload); }
    else{ payload.id = nextId(); payload.createdAt = new Date().toISOString(); state.sizes.push(payload); state.selectedSizeId = payload.id; }
    saveState(); closeDrawer(); render();
  });
}

/* ===================== dynamic handlers ===================== */
function bindHandlers(){
  var mib = document.getElementById("installBtnMobile");
  if(mib) mib.addEventListener("click", tryInstall);

  var goSizes = document.getElementById("goSizes");
  if(goSizes) goSizes.addEventListener("click", function(){ view="sizes"; render(); });

  var sizeSelect = document.getElementById("sizeSelect");
  if(sizeSelect) sizeSelect.addEventListener("change", function(){
    if(listening) stopListening();
    state.selectedSizeId = sizeSelect.value; lastReading=null; tapHistory=[]; recorderOpen=false; resetRecording();
    saveState(); render();
  });

  var btnListen = document.getElementById("btnListen");
  if(btnListen) btnListen.addEventListener("click", function(){
    startListening(function(freq){
      lastReading = { freq:freq, ts:Date.now() };
      tapHistory.unshift(lastReading);
      var size = sizeById(state.selectedSizeId);
      if(size && size.target){
        var n = (state.avgTaps===3) ? Math.min(3, tapHistory.length) : 1;
        var sum=0; for(var i=0;i<n;i++){ sum+=tapHistory[i].freq; }
        var avgFreq = sum/n;
        var diffPct = (avgFreq - size.target)/size.target*100;
        var tol = size.tolerance || 3;
        if(diffPct < -tol || diffPct > tol){ vibrate([40,50,40]); }
        else{ vibrate(70); }
      }else{
        vibrate(30);
      }
      render();
    });
  });
  var btnStop = document.getElementById("btnStop");
  if(btnStop) btnStop.addEventListener("click", stopListening);

  var playRef = document.getElementById("playRef");
  if(playRef) playRef.addEventListener("click", function(){
    var size = sizeById(state.selectedSizeId);
    if(size && size.refAudio) playDataUrl(size.refAudio);
  });

  var openRecorder = document.getElementById("openRecorder");
  if(openRecorder) openRecorder.addEventListener("click", function(){ recorderOpen=true; resetRecording(); render(); });

  var btnStartRec = document.getElementById("btnStartRec");
  if(btnStartRec) btnStartRec.addEventListener("click", startRecordingFlow);
  var btnStopRec = document.getElementById("btnStopRec");
  if(btnStopRec) btnStopRec.addEventListener("click", stopRecordingNow);
  var btnRetryRec = document.getElementById("btnRetryRec");
  if(btnRetryRec) btnRetryRec.addEventListener("click", function(){ resetRecording(); render(); });
  var btnSaveRec = document.getElementById("btnSaveRec");
  if(btnSaveRec) btnSaveRec.addEventListener("click", function(){
    var manualEl = document.getElementById("recManualFreq");
    var val = manualEl ? Number(manualEl.value) : null;
    var finalFreq = (val && val>0) ? val : recFreq;
    if(!finalFreq){ if(manualEl) manualEl.focus(); return; }
    var size = sizeById(state.selectedSizeId);
    if(size){
      size.target = finalFreq;
      size.refAudio = recDataUrl;
      if(!size.tolerance) size.tolerance = 3;
      saveState();
    }
    recorderOpen = false; resetRecording(); render();
  });

  document.querySelectorAll(".sens-chip").forEach(function(el){
    el.addEventListener("click", function(){
      if(el.dataset.sens){ state.sensitivity = el.dataset.sens; saveState(); render(); }
      else if(el.dataset.avg){ state.avgTaps = Number(el.dataset.avg); saveState(); render(); }
    });
  });

  document.querySelectorAll(".slot").forEach(function(el){
    el.addEventListener("click", function(){
      var name = el.dataset.slot;
      var existing = state.sizes.find(function(s){ return s.name===name; });
      if(!existing){
        existing = { id: nextId(), name: name, target: null, tolerance: 3, createdAt: new Date().toISOString() };
        state.sizes.push(existing);
      }
      state.selectedSizeId = existing.id;
      saveState();
      view = "tuner"; recorderOpen=false; resetRecording(); lastReading=null; tapHistory=[];
      render();
    });
  });

  document.querySelectorAll("[data-tone]").forEach(function(el){
    el.addEventListener("click", function(){ playTone(Number(el.dataset.tone)); });
  });

  var btnExport = document.getElementById("btnExport");
  if(btnExport) btnExport.addEventListener("click", exportData);
  var btnImport = document.getElementById("btnImport");
  var importFile = document.getElementById("importFile");
  if(btnImport && importFile){
    btnImport.addEventListener("click", function(){ importFile.click(); });
    importFile.addEventListener("change", function(){
      if(importFile.files && importFile.files[0]){ importDataFromFile(importFile.files[0]); }
      importFile.value = "";
    });
  }

  var addSize = document.getElementById("addSize");
  if(addSize) addSize.addEventListener("click", function(){ openSizeForm(null); });
  document.querySelectorAll("[data-edit-size]").forEach(function(el){
    el.addEventListener("click", function(){ openSizeForm(el.dataset.editSize); });
  });
}

/* ===================== init ===================== */
loadState();
render();
})();
</script>
</body>
</html>
