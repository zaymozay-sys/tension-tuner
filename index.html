/* ---------- форматирование ---------- */
function fmtDate(ts){
  var d = new Date(ts);
  return LANG === "en" ? d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate()) : pad2(d.getDate())+"."+pad2(d.getMonth()+1)+"."+d.getFullYear();
}
function fmtTime(ts){ var d = new Date(ts); return pad2(d.getHours())+":"+pad2(d.getMinutes()); }
function fmtFull(ts){ return fmtDate(ts) + " " + fmtTime(ts); }
function sideLabel(cm){ return fmtNum(cm, 0) + " " + T("см"); }
function pct(x){ return Math.round(x * 100); }
/* отклонение со знаком, без «-0,0» */
function fmtDev(dev){ var r = Math.round(dev * 10) / 10; if(r === 0) r = 0; return (r > 0 ? "+" : "") + fmtNum(r, 1); }
function isoDay(ts){ var d = new Date(ts); return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate()); }
function reasonText(code){
  switch(code){
    case "loose": return T("слабое натяжение");
    case "tight": return T("слишком туго");
    case "fast": return T("быстро затухает");
    case "rattle": return T("дребезг, нечистый тон");
    case "dull": return T("глухой звук");
    case "notone": return T("нет отклика");
    case "sag": return T("провисание полотна");
    case "noisy": return T("шум: затухание не оценено");
    case "interrupted": return T("повторный удар во время затухания");
    case "abort": return T("помеха");
  }
  return String(code || "");
}
function resultText(r){ return r === "pass" ? T("соответствует") : (r === "fail" ? T("не соответствует") : T("проверка прервана")); }
function actionText(a){ return a === "pack" ? T("передано на упаковку") : (a === "correct" ? T("возвращено на корректировку") : T("провести проверку заново")); }
function attemptText(r){ return (r.attempt || 1) > 1 ? F(T("повторная, попытка {0}"), r.attempt) : T("первичная"); }
function sagText(s){ return s === "none" ? T("нет") : (s === "present" ? T("есть") : "—"); }
function thrText(t){
  return F(T("затухание не короче {0}% эталона; чистота тона не ниже {1}% эталона и не ниже {2}%"), pct(t.decayRel), pct(t.purityRel), pct(t.purityAbs));
}
function refAudioExt(size){
  var m = /^data:audio\/([a-z0-9]+)/i.exec(String(size.refAudio || ""));
  var t = m ? m[1].toLowerCase() : "webm";
  return t === "mp4" ? "m4a" : (t === "ogg" ? "ogg" : "webm");
}
function refAudioName(size){
  var stamp = size.refRecordedAt ? isoDay(size.refRecordedAt) : "0000-00-00";
  return FILE_PREFIX + (LANG === "en" ? "-reference-" : "-etalon-") + (size.sideCm != null ? size.sideCm + (LANG === "en" ? "cm" : "sm") : safeName(size.name)) + "-" + stamp + "." + refAudioExt(size);
}
function sideSizes(){ return state.sizes.filter(isSideSize).sort(function(a,b){ return a.sideCm - b.sideCm; }); }
function sizeBySide(cm){ return state.sizes.find(function(s){ return isSideSize(s) && s.sideCm === cm; }); }

/* ---------- изделия и статусы ---------- */
function itemKey(order, side){ return String(order).trim().toLowerCase() + "|" + side; }
function lastRecordOf(key){
  for(var i = registry.length - 1; i >= 0; i--){
    var r = registry[i];
    if(r.item === key && r.result !== "aborted") return r;
  }
  return null;
}
function pendingItems(){
  var latest = {};
  registry.forEach(function(r){ if(r.result !== "aborted") latest[r.item] = r; });
  return Object.keys(latest).map(function(k){ return latest[k]; })
    .filter(function(r){ return r.result === "fail"; })
    .sort(function(a,b){ return b.ts - a.ts; });
}
function regStats(recs){
  var st = { records:recs.length, checks:0, primary:0, repeat:0, aborted:0, items:0, firstPass:0, returned:0,
             afterCorrPass:0, pending:0, reasons:{}, bySide:{}, tools:{}, operators:{}, thr:{}, refs:{}, from:null, to:null };
  var items = {};
  recs.forEach(function(r){
    st.from = st.from == null ? r.ts : Math.min(st.from, r.ts);
    st.to = st.to == null ? r.ts : Math.max(st.to, r.ts);
    if(r.result === "aborted"){ st.aborted++; return; }
    st.checks++;
    if((r.attempt || 1) > 1) st.repeat++; else st.primary++;
    (r.reasons || []).forEach(function(c){ st.reasons[c] = (st.reasons[c] || 0) + 1; });
    var tk = (r.toolId || "—") + "|" + (r.toolMass || "");
    if(!st.tools[tk]) st.tools[tk] = { id:r.toolId, mass:r.toolMass, n:0, from:r.ts, to:r.ts };
    st.tools[tk].n++; st.tools[tk].to = Math.max(st.tools[tk].to, r.ts); st.tools[tk].from = Math.min(st.tools[tk].from, r.ts);
    var op = r.operator || "—";
    st.operators[op] = (st.operators[op] || 0) + 1;
    if(r.thr){ st.thr[thrText(r.thr)] = (st.thr[thrText(r.thr)] || 0) + 1; }
    if(r.ref){ var rk = r.side + "|" + (r.ref.recordedAt || "") + "|" + r.ref.target; if(!st.refs[rk]) st.refs[rk] = { side:r.side, ref:r.ref, n:0 }; st.refs[rk].n++; }
    var it = items[r.item];
    if(!it){ it = items[r.item] = { side:r.side, first:r, last:r, hadFail:false }; }
    it.last = r;
    if(r.result === "fail") it.hadFail = true;
  });
  Object.keys(items).forEach(function(k){
    var it = items[k];
    st.items++;
    var firstOk = it.first.result === "pass" && (it.first.attempt || 1) === 1;
    if(firstOk) st.firstPass++;
    if(it.hadFail) st.returned++;
    if(it.hadFail && it.last.result === "pass") st.afterCorrPass++;
    if(it.last.result === "fail") st.pending++;
    var bs = st.bySide[it.side] || (st.bySide[it.side] = { items:0, firstPass:0, returned:0, finalPass:0, pending:0 });
    bs.items++;
    if(firstOk) bs.firstPass++;
    if(it.hadFail) bs.returned++;
    if(it.last.result === "pass") bs.finalPass++;
    if(it.last.result === "fail") bs.pending++;
  });
  return st;
}

/* ---------- состояние экрана проверки ---------- */
var proShot = null;          // результат удара, ещё не внесённый в реестр
var proSag = null;           // "none" | "present"
var proLast = null;          // последняя внесённая запись
var proForm = { order: "", correction: "" };
var proRep = { from: null, to: null };
var calibArm = null;         // "good" | "bad" — какой удар подбора порогов сейчас слушаем

function proReady(){ return !!(state.pro.operator && state.pro.toolId && state.pro.toolMass); }
function toolNeedsAck(){ return state.pro.toolAck === false; }
function exportReminderHtml(withLink){
  if(!registry.length) return "";

function passportHtml(){

function resultCardHtml(r){
  var cls = r.result === "pass" ? "pass" : (r.result === "fail" ? "fail" : "aborted");
  var head = r.result === "pass" ? F(T("✓ Запись № {0}: соответствует — передать на упаковку"), r.no)
    : (r.result === "fail" ? F(T("✕ Запись № {0}: не соответствует — вернуть на корректировку"), r.no)
    : F(T("↻ Запись № {0}: проверка прервана — повторите проверку"), r.no));

function shotVerdictHtml(shot, size){
  var a = shot.acoustic, vi = verdictInfo(a), cls, icon, text;
  if(vi){ cls = vi.cls; icon = vi.icon; text = vi.text; }
  else if(a === "notone"){ cls = "reject"; icon = "?"; text = T("Нет отклика: тон не определился — глухой удар, промах или посторонний шум"); }
  else if(a === "noisy"){ cls = "idle"; icon = "!"; text = T("Шумно: затухание не оценено — проверку нужно повторить"); }
  else { cls = "idle"; icon = "!"; text = T("Затухание прервано повторным ударом — проверку нужно повторить"); }
  var html = '';
  if(shot.freq){
    var dev = (shot.freq - size.target) / size.target * 100;
    html += '<div class="freq-readout">' + fmtHz(shot.freq) + '<span class="freq-unit">' + T("Гц") + '</span></div>' +
      '<div class="freq-target">' + F(T("{0}% от эталона {1} Гц · допуск ±{2}%"), fmtDev(dev), fmtHz(size.target), size.tolerance || 3) + '</div>' +
      renderMetrics(size, { freq:shot.freq, purity:shot.purity, decayMs:shot.decayMs, decayState:shot.decayState, verdict:a });
  }
  return html + '<div class="verdict ' + cls + '" id="verdictBox">' + icon + ' ' + text + '</div>';
}

/* подсказка под номером заказа: повторная проверка или «уже годно». Обновляется при вводе без перерисовки экрана,
   чтобы нажатие «Слушать удар» сразу после ввода номера не терялось */
function itemNoteState(size){
  var order = proForm.order.trim();
  var last = (order && size) ? lastRecordOf(itemKey(order, size.sideCm)) : null;
  return last && (last.result === "fail" || last.result === "pass") ? last : null;
}
function itemNoteHtml(size){
  var last = itemNoteState(size);
  if(!last) return "";
  if(last.result === "fail"){
    var first = registry.find(function(r){ return r.item === last.item && (r.attempt || 1) === 1 && r.result !== "aborted"; }) || last;
    return '<div class="recheck-note">' + F(T("Повторная проверка после корректировки · попытка {0} · первичная запись № {1}"), (last.attempt || 1) + 1, first.no) + '</div>' +
      '<div class="field"><label>' + T("Корректировка") + '</label><input id="proCorrection" type="text" value="' + escapeHtml(proForm.correction || T("Дотяжка шнура")) + '"></div>';
  }
  return '<div class="field-hint" style="margin:-4px 0 12px;">' + F(T("Это изделие уже прошло проверку (запись № {0}). Если это другой холст из того же заказа, укажите номер через дробь: {1}/2."), last.no, escapeHtml(proForm.order.trim())) + '</div>';
}
var itemNoteKey = null;
function bindCorrection(){
  var corr = document.getElementById("proCorrection");
  if(corr) corr.addEventListener("input", function(){ proForm.correction = corr.value; });
}
function refreshItemNote(){
  var box = document.getElementById("proItemNote"), size = curSize();
  if(!box || !size) return;
  var last = itemNoteState(size), key = last ? last.id : "";
  if(key === itemNoteKey) return;
  itemNoteKey = key;
  box.innerHTML = itemNoteHtml(size);
  bindCorrection();
}

/* ---------- экран «Проверка» ---------- */
function renderCheck(){
  var html = topbar(T("Проверка изделия"), T("Один удар по середине шнура → отметка о провисании → запись в реестр"));

  html += passportHtml();
  if(!proReady()){
    return html + '<div class="frame">' + '<p style="margin:0 0 10px;font-size:13px;">' +
      T("Перед первой проверкой укажите исполнителя и паспорт контрольного ключа: идентификатор и массу. Эти данные попадают в каждую запись реестра.") + '</p>' +
      '<button class="btn block" data-pro-settings="1">' + T("Заполнить") + '</button></div>';
  }
  if(toolNeedsAck()){
    html += '<div class="pro-banner">' + F(T("Ключ заменён: {0}, {1} г. Перед проверками сделайте удар по изделию с эталонным натяжением и убедитесь, что отклик совпадает с эталоном."), escapeHtml(state.pro.toolId), escapeHtml(String(state.pro.toolMass))) +
      '<button class="btn sm" id="proToolAck" style="margin-top:8px;">' + T("Отклик сверен с эталонами") + '</button></div>';
  }
  html += exportReminderHtml(true);
  if(proLast) html += resultCardHtml(proLast);
  html += pendingHtml();

  var sizes = modeSizes().slice().sort(function(a,b){ return a.sideCm - b.sideCm; });
  if(!sizes.length){
    return html + emptyState("▭", T("Нет эталонов"), T("Создайте перечень длин стороны и запишите эталоны на вкладке «Эталоны»."),
      '<button class="btn" id="goRefs">' + T("Перейти к эталонам") + '</button>');
  }
  /* несохранённый удар не теряется: экран всегда возвращается к его длине, пока удар не записан */

  setSel(size.id);

  html += '<div class="section-title">' + T("Новая проверка") + '</div><div class="frame">' +
    '<div class="field"><label>' + T("Номер заказа") + '</label><input id="proOrder" type="text" autocomplete="off" value="' + escapeHtml(proForm.order) + '" placeholder="' + T("например, 1234 или 1234/2") + '"></div>' +
    '<div class="field"><label>' + T("Длина стороны со шнуром") + '</label><select id="sizeSelect"' + (proShot ? ' disabled' : '') + '>' +
    sizes.map(function(s){
      return '<option value="' + s.id + '"' + (s.id === size.id ? " selected" : "") + '>' + sideLabel(s.sideCm) + (s.target == null ? " — " + T("нет эталона") : "") + '</option>';
    }).join("") + '</select></div>' +
    '<div id="proItemNote">' + itemNoteHtml(size) + '</div>';

  if(size.target == null){
    html += '<div class="ref-hint" style="text-align:left;">' + F(T("Для длины {0} нет эталона. Без эталона изделие не выпускают по субъективной оценке — сначала запишите эталон."), sideLabel(size.sideCm)) + '</div>' +
      '<button class="btn block" id="goRefs" style="margin-top:10px;">' + T("Записать эталон") + '</button></div>';
    return html;
  }
  html += '<div class="freq-target" style="text-align:left;margin-bottom:10px;">' + refLineHtml(size) + '</div>';

  if(listening){
    var dec = engineState() === "decay";
    html += '<div class="verdict idle" id="verdictBox">' + (dec ? "⏳ " + T("Удар принят — слушаю, как затухает звук…") : "◉ " + T("Ударьте один раз по середине шнура, перпендикулярно ему")) + '</div>' +
      '<div class="osc-wrap"><div class="osc-label">' + T("сигнал с микрофона") + '</div><canvas class="osc-canvas" id="oscCanvas" width="300" height="52"></canvas></div>' +
      '<div class="sens-row">' + Object.keys(SENS).map(function(k){
        return '<div class="sens-chip' + (state.sensitivity === k ? " active" : "") + '" data-sens="' + k + '">' + SENS[k].label + '</div>';
      }).join("") + '</div>' +
      '<div class="mic-controls"><button class="btn danger block lg" id="btnStop">' + T("Остановить") + '</button></div>';
  }else if(proShot && proShot.sizeId === size.id){
    var a = proShot.acoustic, measurable = a !== "notone" && a !== "noisy" && a !== "interrupted";
    html += shotVerdictHtml(proShot, size);

      if(!proSag) html += '<div class="field-hint" style="text-align:center;">' + T("Отметьте результат осмотра полотна — без этого запись не вносится.") + '</div>';
    }

      html += '<div style="text-align:center;margin-top:10px;"><button class="link-btn" id="proAbort">' + T("↻ Не засчитывать удар: записать «проверка прервана»") + '</button></div>' +
        '<div class="field-hint" style="text-align:center;">' + T("Например, выбрана не та длина или удар пришёлся не по середине шнура. Запись останется в реестре.") + '</div>';

      html += '<div class="btn-row" style="margin-top:10px;">' +

    }
  }else{
    html += '<button class="btn block lg" id="btnProListen">' + T("🎙 Слушать удар") + '</button>' +

  }
  if(micErrorMsg){ html += '<div class="mic-error">' + escapeHtml(micErrorMsg) + '</div>'; }
  return html + '</div>';
}

function onProTap(ev){
  var size = curSize();
  if(ev.type === "decay-start"){ render(); return; }
  if(size){
    if(ev.type === "notone"){ proShot = { acoustic:"notone", sizeId:size.id }; }
    else{
      var shot = { freq:ev.freq, purity:ev.purity, decayMs:ev.decayMs, decayState:ev.decayState, sizeId:size.id };
      if(ev.decayState === "interrupted") shot.acoustic = "interrupted";
      else if(ev.decayState === "noisy") shot.acoustic = "noisy";
      else shot.acoustic = judgeTap(ev, refOf(size));
      proShot = shot;
    }
    proSag = null; proLast = null;
    vibrate(proShot.acoustic === "tuned" ? 70 : [40,50,40]);
  }
  stopListening();
}

function makeRecord(kind){
  var size = sizeById(proShot ? proShot.sizeId : selId());
  if(!size) return null;
  var order = proForm.order.trim(), key = itemKey(order, size.sideCm), last = lastRecordOf(key);
  var isRe = !!(last && last.result === "fail");
  var rec = {
    id: newRecId(), no: state.pro.nextNo || 1, ts: Date.now(), v: APP_VERSION,
    order: order, side: size.sideCm, item: key,
    attempt: isRe ? (last.attempt || 1) + 1 : 1, prev: isRe ? last.id : null, prevNo: isRe ? last.no : null,
    correction: isRe ? String(proForm.correction || T("Дотяжка шнура")).trim() : null,
    operator: state.pro.operator, toolId: state.pro.toolId, toolMass: state.pro.toolMass,
    ref: { target:size.target, tol:size.tolerance || 3, decay:size.refDecay != null ? size.refDecay : null, decayState:size.refDecayState || null,
           purity:size.refPurity != null ? size.refPurity : null, recordedAt:size.refRecordedAt || null, toolId:size.refToolId || null },
    thr: curThr(),
    freq:null, dev:null, decayMs:null, decayState:null, purity:null, acoustic:null, sag:null, result:null, reasons:[], action:null
  };
  if(proShot){
    rec.acoustic = proShot.acoustic;
    if(proShot.freq){
      rec.freq = proShot.freq; rec.dev = (proShot.freq - size.target) / size.target * 100;
      rec.decayMs = proShot.decayMs != null ? proShot.decayMs : null; rec.decayState = proShot.decayState || null;
      rec.purity = proShot.purity != null ? proShot.purity : null;
    }
  }
  if(kind === "abort"){
    rec.result = "aborted"; rec.action = "repeat";
    rec.reasons = [proShot && (proShot.acoustic === "noisy" || proShot.acoustic === "interrupted") ? proShot.acoustic : "abort"];
  }else{
    rec.sag = proSag;
    var reasons = [];
    if(rec.acoustic !== "tuned") reasons.push(rec.acoustic);
    if(proSag === "present") reasons.push("sag");
    rec.reasons = reasons;
    rec.result = reasons.length ? "fail" : "pass";
    rec.action = reasons.length ? "correct" : "pack";
  }
  state.pro.nextNo = rec.no + 1;
  saveState();
  return rec;
}
var proSaving = false;
function commitRecord(kind){
  if(proSaving) return;
  var rec = makeRecord(kind);
  if(!rec) return;
  proSaving = true;
  regAdd(rec, function(ok){
    proSaving = false;
    proLast = rec; proShot = null; proSag = null;
    if(rec.result !== "aborted"){ proForm.order = ""; proForm.correction = ""; }
    vibrate(rec.result === "pass" ? 70 : [40,50,40]);
    render();
    try{ window.scrollTo(0, 0); }catch(e){}
    if(!ok) notify(T("Запись могла не сохраниться. Сохраните резервную копию."));
  });
}

/* ---------- экран «Реестр» ---------- */

  var st = regStats(registry);

  if(!registry.length){
    html += '<div class="field-hint" style="margin:0;">' + T("Записей пока нет. Проверки вносятся на вкладке «Проверка».") + '</div>';
  }else{

      html += '<div class="reg-row"><span class="r-no">' + (LANG === "en" ? "#" : "№") + r.no + '</span><span class="r-time">' + fmtDateTime(r.ts) + '</span>' +

    });
    if(registry.length > 30) html += '<div class="field-hint">' + F(T("Показаны последние 30 из {0}. Полный реестр — в выгрузке."), registry.length) + '</div>';
  }
  html += '</div>';

  var today = isoDay(Date.now());
  if(!proRep.to) proRep.to = today;

  }

  if(listening){
    html += '<div class="verdict idle" id="verdictBox">' + (engineState() === "decay" ? "⏳ " + T("Удар принят — слушаю, как затухает звук…")
      : "◉ " + (calibArm === "good" ? T("Ударьте по годному изделию") : T("Ударьте по недотянутому изделию"))) + '</div>' +
      '<div class="osc-wrap"><div class="osc-label">' + T("сигнал с микрофона") + '</div><canvas class="osc-canvas" id="oscCanvas" width="300" height="52"></canvas></div>' +
      '<div class="mic-controls"><button class="btn danger block" id="btnStop">' + T("Остановить") + '</button></div>';
  }else{
    html += '<div class="btn-row"><button class="btn" id="calGood">' + T("🎙 Удар по годному") + '</button><button class="btn secondary" id="calBad">' + T("🎙 Удар по недотянутому") + '</button></div>' +
      '<div class="field-hint">' + T("Годное — натянуто как эталон. Недотянутое — шнур нарочно ослаблен. Рекомендуется 10–15 годных и 5–10 недотянутых ударов.") + '</div>';
  }

    html += '<div class="section-title">' + T("Рекомендация") + '</div><div class="frame">' +
      '<div style="font-size:13px;line-height:1.6;">' + F(T("Допуск по частоте для {0}: ±{1}%."), sideLabel(size.sideCm), sug.tol) + '<br>' +
      T("Пороги брака") + ': ' + thrText(sug) + '.<br>' +
      F(T("Годные проходят: {0} из {1}. Недотянутые выявлены: {2} из {3}."), sug.goodPass, sug.goodN, sug.badCaught, sug.badN) + '</div>' +
      (sug.badN && sug.badCaught < sug.badN ? '<div class="field-hint">' + T("Часть недотянутых изделий по звуку не отличается от годных: проверьте эталон и сделайте больше ударов.") + '</div>' : '') +
      '<button class="btn block" id="calApply" style="margin-top:10px;">' + T("Применить") + '</button>' +
      '<div class="field-hint">' + T("Пороги брака общие для всех длин; допуск по частоте сохраняется для этой длины.") + '</div></div>';
  }else{
    html += '<div class="field-hint">' + T("Рекомендация появится после трёх ударов по годным изделиям.") + '</div>';
  }
  if(smp.length){
    html += '<div class="section-title">' + F(T("Удары подбора · {0}"), smp.length) + '</div><div class="frame">';

      var dev = (s.freq - size.target) / size.target * 100;
      var dr = (size.refDecay && s.decayMs != null && (s.decayState === "ok" || s.decayState === "long")) ? pct(s.decayMs / size.refDecay) + '%' : '—';

  }
  return html;
}
function onCalibTap(ev){
  var size = curSize();
  if(ev.type === "decay-start"){ render(); return; }
  var arm = calibArm; calibArm = null;
  if(!size || ev.type === "notone"){ notify(T("Тон не определился — удар не учтён.")); stopListening(); return; }
  if(ev.decayState === "interrupted" || ev.decayState === "noisy"){ notify(T("Затухание не оценено (шум или повторный удар) — удар не учтён.")); stopListening(); return; }
  if(!Array.isArray(state.calib[size.id])) state.calib[size.id] = [];
  state.calib[size.id].unshift({ label: arm || "good", ts: Date.now(), freq: ev.freq, purity: ev.purity, decayMs: ev.decayMs, decayState: ev.decayState });
  if(state.calib[size.id].length > 60) state.calib[size.id].length = 60;
  saveState();
  vibrate(45);
  stopListening();
}

/* ---------- CSV ---------- */
function csvDownload(rows, name){
  var en = LANG === "en", sep = en ? "," : ";";
  var text = rows.map(function(r){ return r.map(function(c){ return csvCell(c, sep); }).join(sep); }).join("\r\n");
  downloadBlob(new Blob(["﻿" + text], { type: "text/csv;charset=utf-8" }), name);
}
function numCsv(x, d){ if(x == null || isNaN(x)) return ""; var t = Number(x).toFixed(d); if(/^-0(\.0+)?$/.test(t)) t = t.slice(1); return LANG === "en" ? t : t.replace(".", ","); }
function decCsv(ms, st){
  if(ms == null) return "";
  if(st === "long") return ">" + numCsv(ms / 1000, 2);
  if(st === "ok") return numCsv(ms / 1000, 2);
  return "";
}
function itemFinalText(r){
  var last = lastRecordOf(r.item);
  if(!last) return "";
  return last.result === "pass" ? T("годно") : T("ожидает повторной проверки");
}
function exportRegistryCSV(){

    T("Частота, Гц"), T("Эталон, Гц"), T("Отклонение, %"), T("Допуск, %"), T("Затухание, с"), T("Эталон затухания, с"), T("Чистота тона, %"), T("Эталон чистоты, %"),
    T("Акустический отклик"), T("Провисание"), T("Результат"), T("Причина"), T("Действие"), T("Итог изделия"),
    T("Исполнитель"), T("Ключ"), T("Масса ключа, г"), T("Эталон записан"), T("Пороги"), T("Версия приложения")]];
  registry.forEach(function(r){
    var ref = r.ref || {};
    rows.push([r.no, fmtDate(r.ts), fmtTime(r.ts), r.order, r.side, attemptText(r), r.prevNo || "", r.correction || "",
      numCsv(r.freq, 1), numCsv(ref.target, 1), numCsv(r.dev, 1), ref.tol || "", decCsv(r.decayMs, r.decayState), decCsv(ref.decay, ref.decayState),
      r.purity != null ? pct(r.purity) : "", ref.purity != null ? pct(ref.purity) : "",
      r.acoustic ? (r.acoustic === "tuned" ? T("соответствует эталону") : reasonText(r.acoustic)) : "",
      sagText(r.sag), resultText(r.result), (r.reasons || []).map(reasonText).join(", "), actionText(r.action), itemFinalText(r),
      r.operator || "", r.toolId || "", r.toolMass != null ? numCsv(r.toolMass, 1) : "", ref.recordedAt ? fmtDate(ref.recordedAt) : "",
      r.thr ? thrText(r.thr) : "", r.v || ""]);
  });
  csvDownload(rows, (LANG === "en" ? "taptension-registry-" : "natyazhka-reestr-") + todayStamp() + ".csv");
  state.pro.lastExportTs = Date.now(); saveState(); render();
}
function refRows(){
  var rows = [];
  sideSizes().forEach(function(s){
    if(s.target != null) rows.push({ side:s.sideCm, target:s.target, tol:s.tolerance || 3, decay:s.refDecay, decayState:s.refDecayState, purity:s.refPurity,
      recordedAt:s.refRecordedAt || null, toolId:s.refToolId || "", toolMass:s.refToolMass, operator:s.refOperator || "", audio: s.refAudio ? refAudioName(s) : "", status:T("действующий") });
    (s.refHistory || []).forEach(function(h){
      rows.push({ side:s.sideCm, target:h.target, tol:h.tol, decay:h.decay, decayState:h.decayState, purity:h.purity, recordedAt:h.recordedAt,
        toolId:h.toolId || "", toolMass:h.toolMass, operator:h.operator || "", audio:h.audioName || "", status:F(T("заменён {0}"), fmtDate(h.replacedAt)) });
    });
  });
  return rows;
}
function exportRefsCSV(){
  var list = refRows();
  if(!list.length){ notify(T("Эталонов пока нет.")); return; }
  var rows = [[T("Длина стороны, см"), T("Частота, Гц"), T("Допуск, %"), T("Затухание, с"), T("Чистота тона, %"), T("Записан"), T("Ключ"), T("Масса ключа, г"), T("Исполнитель"), T("Аудиофайл"), T("Статус")]];
  list.forEach(function(h){
    rows.push([h.side, numCsv(h.target, 1), h.tol, decCsv(h.decay, h.decayState), h.purity != null ? pct(h.purity) : "", h.recordedAt ? fmtFull(h.recordedAt) : "",
      h.toolId, h.toolMass != null ? numCsv(h.toolMass, 1) : "", h.operator, h.audio, h.status]);
  });
  csvDownload(rows, (LANG === "en" ? "taptension-references-" : "natyazhka-etalony-") + todayStamp() + ".csv");
}

/* ---------- печатные формы ---------- */
function openPrintView(bodyHtml, landscape){
  var pv = document.getElementById("printView");
  if(!pv){ pv = document.createElement("div"); pv.id = "printView"; document.body.appendChild(pv); }
  pv.innerHTML = '<style>@page{ size: A4 ' + (landscape ? "landscape" : "portrait") + '; margin: 12mm; }</style>' +
    '<div class="pv-bar"><button class="btn" id="pvPrint">' + T("🖨 Печать / PDF") + '</button><button class="btn secondary" id="pvClose">' + T("Закрыть") + '</button></div>' +
    '<div class="pv-doc">' + bodyHtml + '</div>';
  document.documentElement.classList.add("printing");
  document.getElementById("pvPrint").addEventListener("click", function(){ try{ window.print(); }catch(e){} });
  document.getElementById("pvClose").addEventListener("click", closePrintView);
  try{ window.scrollTo(0, 0); }catch(e){}
}
function closePrintView(){
  var pv = document.getElementById("printView");
  if(pv) pv.innerHTML = "";
  document.documentElement.classList.remove("printing");
  render();
}
function metaHtml(code, extra){
  var p = state.pro;
  return '<div class="pv-meta">' + F(T("Форма {0}"), code) + (p.org ? ' · ' + escapeHtml(p.org) : '') + ' · ' + F(T("Сформирован {0}"), fmtFull(Date.now())) +
    ' · ' + F(T("Приложение «Натяжка» {0}"), APP_VERSION) + ' · ' + T("Способ контроля по патенту РФ № 2867038") + (extra ? '<br>' + extra : '') + '</div>';
}
function toolsTableHtml(st){
  var cur = state.pro, rows = Object.keys(st.tools).map(function(k){ return st.tools[k]; });
  var seen = rows.some(function(t){ return t.id === cur.toolId && Number(t.mass) === Number(cur.toolMass); });
  var html = '<table><tr><th>' + T("Идентификатор") + '</th><th>' + T("Масса, г") + '</th><th>' + T("Применялся") + '</th><th>' + T("Проверок") + '</th></tr>';
  rows.forEach(function(t){
    html += '<tr><td>' + escapeHtml(t.id || "—") + '</td><td>' + (t.mass != null ? fmtNum(t.mass, 1) : "—") + '</td><td>' + fmtDate(t.from) + ' — ' + fmtDate(t.to) + '</td><td>' + t.n + '</td></tr>';
  });
  if(cur.toolId && !seen) html += '<tr><td>' + escapeHtml(cur.toolId) + '</td><td>' + (cur.toolMass != null ? fmtNum(cur.toolMass, 1) : "—") + '</td><td>' + T("текущий, проверок пока нет") + '</td><td>0</td></tr>';
  return html + '</table>';
}
function refsTableHtml(){
  var list = refRows();
  if(!list.length) return '<p>' + T("Эталонов нет.") + '</p>';
  var html = '<table><tr><th>' + T("Длина стороны, см") + '</th><th>' + T("Частота, Гц") + '</th><th>' + T("Допуск, %") + '</th><th>' + T("Затухание, с") + '</th><th>' + T("Чистота тона, %") + '</th><th>' + T("Записан") + '</th><th>' + T("Ключ") + '</th><th>' + T("Аудиофайл") + '</th><th>' + T("Статус") + '</th></tr>';
  list.forEach(function(h){
    html += '<tr><td>' + h.side + '</td><td>' + fmtHz(h.target) + '</td><td>' + h.tol + '</td><td>' + (decCsv(h.decay, h.decayState) || "—") + '</td><td>' + (h.purity != null ? pct(h.purity) : "—") + '</td><td>' +
      (h.recordedAt ? fmtFull(h.recordedAt) : "—") + '</td><td>' + escapeHtml(h.toolId || "—") + '</td><td>' + escapeHtml(h.audio || "—") + '</td><td>' + escapeHtml(h.status) + '</td></tr>';
  });
  return html + '</table>';
}
function signHtml(){
  return '<div class="pv-sign">' + T("Ответственный") + ': ______________________ / ______________________ /&nbsp;&nbsp;&nbsp;' + T("Дата") + ': ____________</div>';
}
function printRP01(){
  if(!registry.length && !sideSizes().some(function(s){ return s.target != null; })){ notify(T("Реестр пуст — сначала проведите проверки.")); return; }
  var st = regStats(registry);
  var html = '<h1>' + T("Реестр применения способа контроля натяжения гибкого подвеса") + '</h1>' +
    metaHtml(T("РП-01"), registry.length ? F(T("Записей: {0} · период {1} — {2}"), registry.length, fmtDate(st.from), fmtDate(st.to)) : "") +
    '<h2>' + T("1. Паспорт контрольного инструмента") + '</h2><div class="pv-scroll">' + toolsTableHtml(st) + '</div>' +
    '<h2>' + T("2. Перечень эталонных звуковых образцов") + '</h2><div class="pv-scroll">' + refsTableHtml() + '</div>' +
    '<h2>' + T("3. Проверки") + '</h2><div class="pv-scroll"><table><tr><th>' + NO_SIGN() + '</th><th>' + T("Дата, время") + '</th><th>' + T("Заказ") + '</th><th>' + T("Длина, см") + '</th><th>' + T("Проверка") + '</th><th>' +
    T("Частота, Гц (откл.)") + '</th><th>' + T("Затухание, с") + '</th><th>' + T("Чистота, %") + '</th><th>' + T("Провисание") + '</th><th>' + T("Результат") + '</th><th>' + T("Причина; корректировка") + '</th><th>' + T("Исполнитель") + '</th></tr>';
  registry.forEach(function(r){
    var note = (r.reasons || []).map(reasonText).join(", ");
    if(r.correction) note += (note ? "; " : "") + T("корректировка") + ": " + r.correction;
    if(r.prevNo) note += (note ? "; " : "") + F(T("к записи № {0}"), r.prevNo);
    html += '<tr><td>' + r.no + '</td><td>' + fmtFull(r.ts) + '</td><td>' + escapeHtml(r.order) + '</td><td>' + r.side + '</td><td>' + attemptText(r) + '</td><td>' +
      (r.freq ? fmtHz(r.freq) + ' (' + fmtDev(r.dev) + '%)' : "—") + '</td><td>' + (decCsv(r.decayMs, r.decayState) || "—") + '</td><td>' + (r.purity != null ? pct(r.purity) : "—") + '</td><td>' +
      sagText(r.sag) + '</td><td>' + resultText(r.result) + '</td><td>' + escapeHtml(note || "—") + '</td><td>' + escapeHtml(r.operator || "—") + '</td></tr>';
  });
  html += '</table></div>' + signHtml();
  openPrintView(html, true);
}
function printReport(){
  var fromEl = document.getElementById("repFrom"), toEl = document.getElementById("repTo");
  var from = fromEl && fromEl.value ? fromEl.value : proRep.from, to = toEl && toEl.value ? toEl.value : proRep.to;
  var t0 = new Date(from + "T00:00:00").getTime(), t1 = new Date(to + "T23:59:59").getTime();
  if(!(t0 <= t1)){ notify(T("Проверьте даты периода.")); return; }
  var recs = registry.filter(function(r){ return r.ts >= t0 && r.ts <= t1; });
  if(!recs.length){ notify(T("В выбранном периоде записей нет.")); return; }
  var st = regStats(recs), days = Math.round((t1 - t0) / 86400000);
  function row(k, v){ return '<tr><td>' + k + '</td><td>' + v + '</td></tr>'; }
  function share(n){ return st.items ? ' (' + Math.round(n / st.items * 100) + '%)' : ''; }
  var html = '<h1>' + T("Отчёт о результатах применения способа контроля натяжения гибкого подвеса") + '</h1>' +
    metaHtml(T("ОТЧ-ПАТ-01"), F(T("Период: {0} — {1} ({2} дн.)"), fmtDate(t0), fmtDate(t1), days)) +
    '<h2>' + T("1. Итоги") + '</h2><table>' +
    row(T("Проверок (без прерванных)"), st.checks) +
    row(T("в том числе первичных / повторных"), st.primary + ' / ' + st.repeat) +
    row(T("Прервано проверок"), st.aborted) +
    row(T("Изделий проверено"), st.items) +
    row(T("Соответствовали с первой проверки"), st.firstPass + share(st.firstPass)) +
    row(T("Возвращено на корректировку"), st.returned + share(st.returned)) +
    row(T("Из них прошли повторную проверку"), st.afterCorrPass) +
    row(T("Ожидают повторной проверки"), st.pending) + '</table>';
  var rk = Object.keys(st.reasons);
  html += '<h2>' + T("2. Причины несоответствия") + '</h2>' + (rk.length
    ? '<table><tr><th>' + T("Причина") + '</th><th>' + T("Записей") + '</th></tr>' + rk.map(function(k){ return row(reasonText(k), st.reasons[k]); }).join("") + '</table>'
    : '<p>' + T("Несоответствий нет.") + '</p>');
  html += '<h2>' + T("3. По длине стороны") + '</h2><table><tr><th>' + T("Длина, см") + '</th><th>' + T("Изделий") + '</th><th>' + T("Годно с первой проверки") + '</th><th>' + T("Возвращено") + '</th><th>' + T("Итог: годно") + '</th><th>' + T("Ожидают") + '</th></tr>' +
    Object.keys(st.bySide).sort(function(a,b){ return a - b; }).map(function(k){ var b = st.bySide[k];
      return '<tr><td>' + k + '</td><td>' + b.items + '</td><td>' + b.firstPass + '</td><td>' + b.returned + '</td><td>' + b.finalPass + '</td><td>' + b.pending + '</td></tr>'; }).join("") + '</table>';
  html += '<h2>' + T("4. Инструмент, эталоны, исполнители") + '</h2>' + toolsTableHtml(st) +
    '<table><tr><th>' + T("Длина, см") + '</th><th>' + T("Эталон, Гц") + '</th><th>' + T("Эталон записан") + '</th><th>' + T("Проверок") + '</th></tr>' +
    Object.keys(st.refs).map(function(k){ var x = st.refs[k];
      return '<tr><td>' + x.side + '</td><td>' + fmtHz(x.ref.target) + '</td><td>' + (x.ref.recordedAt ? fmtDate(x.ref.recordedAt) : "—") + '</td><td>' + x.n + '</td></tr>'; }).join("") + '</table>' +
    '<table><tr><th>' + T("Исполнитель") + '</th><th>' + T("Проверок") + '</th></tr>' +
    Object.keys(st.operators).map(function(k){ return row(escapeHtml(k), st.operators[k]); }).join("") + '</table>' +
    '<p>' + T("Пороги оценки") + ': ' + Object.keys(st.thr).map(escapeHtml).join("; ") + '.</p>';
  html += '<h2>' + T("5. Вывод") + '</h2><p>' + F(T("За период способ применён к {0} изделиям ({1} проверок). С первой проверки соответствовали {2}. На корректировку возвращено {3}; после корректировки повторную проверку прошли {4}; ожидают повторной проверки {5}."),
      st.items, st.checks, st.firstPass + share(st.firstPass), st.returned, st.afterCorrPass, st.pending) + '</p>' +
    '<p>' + T("Заключение ответственного") + ': ________________________________________________</p>' + signHtml();
  openPrintView(html, false);
}

/* ---------- обработчики экранов «Про» ---------- */
function bindProHandlers(){
  document.querySelectorAll("[data-pro-settings]").forEach(function(el){ el.addEventListener("click", openProSettings); });
  var goRefs = document.getElementById("goRefs");
  if(goRefs) goRefs.addEventListener("click", function(){ if(listening) stopListening(); view = "refs"; calibArm = null; render(); });
  var goRegistry = document.getElementById("goRegistry");
  if(goRegistry) goRegistry.addEventListener("click", function(){ view = "registry"; render(); });
  var goCalib = document.getElementById("goCalib");
  if(goCalib) goCalib.addEventListener("click", function(){ view = "calib"; recorderOpen = false; resetRecording(); render(); });

  var ack = document.getElementById("proToolAck");
  if(ack) ack.addEventListener("click", function(){ state.pro.toolAck = true; state.pro.toolAckAt = Date.now(); saveState(); render(); });
  var lc = document.getElementById("proLastClose");
  if(lc) lc.addEventListener("click", function(){ proLast = null; render(); });

  var ord = document.getElementById("proOrder");
  if(ord){
    var nb = itemNoteState(curSize());
    itemNoteKey = nb ? nb.id : "";
    ord.addEventListener("input", function(){ proForm.order = ord.value; refreshItemNote(); });
  }
  bindCorrection();

  var listenBtn = document.getElementById("btnProListen");
  if(listenBtn) listenBtn.addEventListener("click", function(){
    var o = document.getElementById("proOrder");
    if(o) proForm.order = o.value;
    var c = document.getElementById("proCorrection");
    if(c) proForm.correction = c.value;
    if(!proForm.order.trim()){ notify(T("Введите номер заказа.")); if(o) o.focus(); return; }
    if(toolNeedsAck()){ notify(T("Сначала сверьте отклик нового ключа с эталонами.")); return; }
    proShot = null; proSag = null; proLast = null;
    startListening(onProTap);
  });
  document.querySelectorAll("[data-sag]").forEach(function(el){
    el.addEventListener("click", function(){ proSag = el.dataset.sag; render(); });
  });
  var rec = document.getElementById("proRecord");
  if(rec) rec.addEventListener("click", function(){
    if(!proShot || !proSag) return;
    commitRecord(proShot.acoustic === "notone" ? "notone" : "measure");
  });
  var ab = document.getElementById("proAbort");
  if(ab) ab.addEventListener("click", function(){ commitRecord("abort"); });
  var ds = document.getElementById("proDiscard");
  if(ds) ds.addEventListener("click", function(){ proShot = null; proSag = null; render(); });
  document.querySelectorAll("[data-recheck]").forEach(function(el){
    el.addEventListener("click", function(){
      var r = registry.find(function(x){ return x.id === el.dataset.recheck; });
      if(!r) return;
      if(proShot){ notify(T("Сначала запишите результат удара в реестр.")); return; }
      var s = sizeBySide(r.side);
      if(!s){ notify(F(T("Длины {0} нет в перечне эталонов — добавьте её и запишите эталон."), sideLabel(r.side))); return; }
      if(listening) stopListening();
      setSel(s.id); saveState();
      proForm.order = r.order; proForm.correction = T("Дотяжка шнура"); proShot = null; proSag = null; proLast = null;
      view = "check"; render();
      var b = document.getElementById("btnProListen") || document.getElementById("proOrder");
      if(b && b.scrollIntoView) b.scrollIntoView({ block: "center" });
    });
  });

  var e1 = document.getElementById("expRegCsv"); if(e1) e1.addEventListener("click", exportRegistryCSV);
  var e2 = document.getElementById("expRefsCsv"); if(e2) e2.addEventListener("click", exportRefsCSV);
  var p1 = document.getElementById("printRp"); if(p1) p1.addEventListener("click", printRP01);
  var p2 = document.getElementById("printRep"); if(p2) p2.addEventListener("click", printReport);
  var rf = document.getElementById("repFrom"); if(rf) rf.addEventListener("change", function(){ proRep.from = rf.value; });
  var rt = document.getElementById("repTo"); if(rt) rt.addEventListener("change", function(){ proRep.to = rt.value; });

  var aps = document.getElementById("addPresetSides");
  if(aps) aps.addEventListener("click", function(){
    var n = addSides(PRESET_SIDES);
    if(!curSize()){ var f = sideSizes()[0]; if(f) setSel(f.id); }
    saveState(); render();
    notify(F(T("Добавлено длин: {0}. Запишите эталон для каждой."), n));
  });
  var as = document.getElementById("addSide"); if(as) as.addEventListener("click", openSideForm);
  document.querySelectorAll("[data-pick-side]").forEach(function(el){
    el.addEventListener("click", function(){
      setSel(el.dataset.pickSide); recorderOpen = false; resetRecording(); saveState(); render();
      try{ window.scrollTo(0, 0); }catch(e){}
    });
  });
  var cr = document.getElementById("closeRecorder"); if(cr) cr.addEventListener("click", function(){ recorderOpen = false; resetRecording(); render(); });
  var dl = document.getElementById("dlRefAudio"); if(dl) dl.addEventListener("click", function(){ downloadRefAudio(curSize()); });
  var et = document.getElementById("editTol"); if(et) et.addEventListener("click", function(){ var s = curSize(); if(s) openTolForm(s); });
  var dsd = document.getElementById("delSide");
  if(dsd) dsd.addEventListener("click", function(){
    var s = curSize();
    if(!s) return;
    if(!confirm(F(T("Удалить длину {0} вместе с эталоном? Записи реестра сохранятся: в каждой записи есть данные эталона, по которому шла проверка."), sideLabel(s.sideCm)))) return;
    state.sizes = state.sizes.filter(function(x){ return x.id !== s.id; });
    fixSelection(); saveState(); render();
  });

  var cg = document.getElementById("calGood"), cb = document.getElementById("calBad");
  function arm(label){ calibArm = label; startListening(onCalibTap); }
  if(cg) cg.addEventListener("click", function(){ arm("good"); });
  if(cb) cb.addEventListener("click", function(){ arm("bad"); });
  document.querySelectorAll("[data-cal-del]").forEach(function(el){
    el.addEventListener("click", function(){
      var s = curSize(); if(!s || !state.calib[s.id]) return;
      state.calib[s.id].splice(Number(el.dataset.calDel), 1); saveState(); render();
    });
  });
  var cc = document.getElementById("calClear");
  if(cc) cc.addEventListener("click", function(){
    var s = curSize(); if(!s) return;
    if(!confirm(T("Очистить все удары подбора для этой длины?"))) return;
    state.calib[s.id] = []; saveState(); render();
  });
  var ca = document.getElementById("calApply");
  if(ca) ca.addEventListener("click", function(){
    var s = curSize(); if(!s) return;
    var sug = suggestThresholds(calibSamples(s), refOf(s));
    if(!sug) return;
    state.thresholds = { decayRel: sug.decayRel, purityRel: sug.purityRel, purityAbs: sug.purityAbs };
    s.tolerance = sug.tol;
    saveState(); render();
    notify(T("Пороги применены. Они сохраняются в каждой новой записи реестра."));
  });
}

applyStaticText();
var brandVersionEl = document.getElementById("brandVersion");
if(brandVersionEl){ brandVersionEl.textContent = F(T("версия {0}"), APP_VERSION); }

loadState();
render();
regInit(function(){ render(); });
if(isPro()) requestPersistentStorage();
window.__tt = { state: state, render: render, notify: notify, T: T, LANG: LANG, reg: function(){ return registry; }, backend: function(){ return regBackend; } };
})();
